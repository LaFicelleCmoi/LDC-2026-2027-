<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <!-- Fond de la page Clubs allemands : ballon lumineux drapé du drapeau
       (noir, rouge, or, bandes qui suivent la courbure) et les 4 étoiles
       de champion du monde. Affiché en mix-blend-mode screen par pagebg.css (pendant du
       franceball.svg de la page Clubs français). -->
  <defs>
    <radialGradient id="glow" cx="44%" cy="38%" r="68%">
      <stop offset="0%"  stop-color="#ffd75a" stop-opacity="0.60"/>
      <stop offset="40%" stop-color="#dd2a1a" stop-opacity="0.38"/>
      <stop offset="74%" stop-color="#5a1408" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a1430" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rim" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#ffd98a" stop-opacity="0"/>
      <stop offset="93%" stop-color="#ffd98a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="st" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffce00"/>
    </linearGradient>
    <clipPath id="ball"><circle cx="300" cy="292" r="286"/></clipPath>
    <path id="s" d="M0,-50 L12.3,-17 L47.6,-15.5 L20,6.5 L29.4,40.5 L0,21 L-29.4,40.5 L-20,6.5 L-47.6,-15.5 L-12.3,-17 Z"/>
  </defs>

  <circle cx="300" cy="292" r="288" fill="url(#glow)"/>
  <g clip-path="url(#ball)">
    <path d="M0 0 L600 0 L600 196 Q300 236 0 196 Z" fill="#3a3a44" opacity="0.30"/>
    <path d="M0 196 Q300 236 600 196 L600 388 Q300 428 0 388 Z" fill="#dd0000" opacity="0.46"/>
    <path d="M0 388 Q300 428 600 388 L600 600 L0 600 Z" fill="#ffce00" opacity="0.46"/>
  </g>
  <circle cx="300" cy="292" r="286" fill="url(#rim)"/>

  <!-- méridiens, très discrets -->
  <g fill="none" stroke="#ffd98a" stroke-opacity="0.16" stroke-width="1.4">
    <ellipse cx="300" cy="292" rx="118" ry="286"/>
    <path d="M300 6 Q120 292 300 578"/>
    <path d="M300 6 Q480 292 300 578"/>
  </g>

  <!-- 4 étoiles de champion du monde -->
  <g fill="url(#st)">
    <use href="#s" transform="translate(186,118) scale(0.62)" opacity="0.9"/>
    <use href="#s" transform="translate(262,96) scale(0.62)" opacity="0.9"/>
    <use href="#s" transform="translate(338,96) scale(0.62)" opacity="0.9"/>
    <use href="#s" transform="translate(414,118) scale(0.62)" opacity="0.9"/>
  </g>
</svg>
