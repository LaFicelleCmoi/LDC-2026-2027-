<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Overlay OBS — Ligue des Champions</title>
<link rel="icon" href="logo.svg?v=2" type="image/svg+xml" />
<!--
  overlay.html — OVERLAY OBS AUTONOME (aucune dépendance externe à part l'API ESPN)
  Fond TRANSPARENT obligatoire pour la source navigateur OBS.

  PARAMÈTRES D'URL (tous optionnels — sans aucun paramètre, suit les matchs en direct) :
    ── Cible ──────────────────────────────────────────────────────────────
    team=PSG            épingle un club (abréviation 3 lettres OU nom anglais)
    team=fav            suit le club favori choisi sur le site (localStorage)
    team=all|live       force l'affichage de TOUS les matchs en direct (ignore le favori)
    date=AAAAMMJJ       revue d'une journée précise (ex. 20250531 = finale 2025)
    next=1              hors-direct : promeut le prochain match à venir (compte à rebours)
    ── Placement ──────────────────────────────────────────────────────────
    pos=top-left|top-right|bottom-left|bottom-right|top-center|bottom-center  (défaut bottom-left)
    size=sm|md|lg       préréglage de taille (défaut md)
    scale=1.3           échelle fine (0.5–3), se combine à size
    margin=16           marge au bord en px
    ── Apparence ──────────────────────────────────────────────────────────
    theme=dark|glass|minimal|broadcast   (défaut dark)
    accent=RRGGBB       couleur d'accent (défaut : couleur du club favori, sinon or)
    chroma=00FF00       fond uni pour incrustation chroma key (sinon transparent)
    anim=0              désactive toutes les animations (auto si "prefers-reduced-motion")
    brand=0             masque le petit logo
    ── Contenu ────────────────────────────────────────────────────────────
    compact=1           mode compact (score seul)
    events=0            masque le fil d'événements
    maxEvents=8         nombre max de lignes d'événements (0–20, défaut 12)
    round=0             masque la pastille de tour (Phase de ligue / 8es / Finale…)
    stats=1             bandeau statistiques live (possession / tirs / corners)
    teamColors=1        liserés aux couleurs des clubs
    ── Réglages ───────────────────────────────────────────────────────────
    hideEmpty=1         masque tout s'il n'y a aucun match
    poll=18             cadence du sondage en s (8–60, repli exponentiel en cas d'échec)
    rotate=0            fige sur le 1er match (pas de rotation)
    lang=fr|en          langue (partagée avec le site)
    demo=goal           prévisualise l'animation de but
-->
<style>
  :root{
    --fav-rgb:   245,181,10;             /* accent dynamique (club favori / ?accent) — or par défaut */
    --bg:        rgba(11,14,26,0.92);
    --bg2:       rgba(20,24,42,0.92);
    --line:      rgba(255,255,255,0.10);
    --txt:       #f4f6ff;
    --muted:     #9aa3c4;
    --live:      #ff3b46;                /* sémantique : reste rouge */
    --upcoming:  rgb(var(--fav-rgb));    /* suit l'accent */
    --finished:  #28c76f;                /* sémantique : reste vert */
    --interrupt: #ff8a00;
    --pen:       #4aa8ff;
    --accent:    rgb(var(--fav-rgb));
  }

  html,body{
    margin:0; padding:0;
    background:transparent !important;   /* indispensable pour OBS */
    font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
    color:var(--txt);
    -webkit-font-smoothing:antialiased;
  }

  /* Réduction de mouvement : OFF total des animations/transitions */
  body.no-anim *, body.no-anim *::before, body.no-anim *::after{
    animation:none !important; transition:none !important;
  }

  /* ---- Ancrage dans un coin ------------------------------------------- */
  #stage{ position:fixed; inset:0; pointer-events:none; }
  #wrap{
    position:fixed; max-width:430px; pointer-events:none;
  }
  #wrap.pos-top-left{     transform-origin:top left; }
  #wrap.pos-top-right{    transform-origin:top right; }
  #wrap.pos-bottom-left{  transform-origin:bottom left; }
  #wrap.pos-bottom-right{ transform-origin:bottom right; }
  #wrap.pos-top-center{   transform-origin:top center; }
  #wrap.pos-bottom-center{transform-origin:bottom center; }

  /* ---- Scorebug -------------------------------------------------------- */
  .scorebug{
    position:relative;
    background:linear-gradient(160deg,var(--bg),var(--bg2));
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:0 18px 50px rgba(0,0,0,.55);
    overflow:hidden;
    backdrop-filter:blur(4px);
    width:410px;
    transition:transform .18s ease;
    max-height:calc(100vh - 24px);
  }
  .scorebug.enter{ animation:bugIn .42s cubic-bezier(.2,.9,.25,1.15); }
  @keyframes bugIn{ from{opacity:0; transform:translateY(7px) scale(.985)} to{opacity:1; transform:none} }
  .scorebug.bump{ animation:bump .6s ease; }
  @keyframes bump{ 0%{transform:scale(1)} 30%{transform:scale(1.05)} 100%{transform:scale(1)} }
  .scorebug.goal-flash::after{
    content:""; position:absolute; inset:0; border-radius:14px;
    background:radial-gradient(circle at 50% 0%,rgba(40,199,111,.55),transparent 70%);
    animation:flash 1.2s ease forwards; pointer-events:none;
  }
  @keyframes flash{ 0%{opacity:1} 100%{opacity:0} }

  .topbar{ height:6px; width:100%; background:var(--upcoming); transition:background .3s; }
  .topbar.live{ background:var(--live); animation:pulseBar 1.4s infinite; }
  .topbar.finished{ background:var(--finished); }
  .topbar.upcoming{ background:var(--upcoming); }
  .topbar.interrupt{ background:var(--interrupt); }
  @keyframes pulseBar{ 0%,100%{opacity:1} 50%{opacity:.45} }

  /* ---- Barre principale : une seule ligne horizontale (style lower-third TV) ---- */
  .bug-main{
    display:flex; align-items:center; gap:9px;
    padding:9px 13px; white-space:nowrap;
  }
  .mn{
    font-variant-numeric:tabular-nums; font-weight:800; font-size:15px;
    min-width:30px; text-align:center; color:var(--txt);
    padding-right:9px; border-right:1px solid var(--line); flex:none;
  }
  .mn.live{ color:#fff; }
  .mn .extra{ color:var(--finished); font-size:12px; margin-left:1px; }
  .mn .etbadge{ display:block; font-size:8px; font-weight:800; letter-spacing:.5px; color:var(--interrupt); margin-top:-1px; }

  .side{ display:flex; align-items:center; gap:8px; flex:1 1 0; min-width:0; }
  .side.home{ justify-content:flex-end; }
  .side.away{ justify-content:flex-start; }
  .side .crest{ width:27px; height:27px; object-fit:contain; filter:drop-shadow(0 2px 4px rgba(0,0,0,.5)); flex:none; }
  .side .crest.fallback{
    display:flex; align-items:center; justify-content:center; border-radius:50%;
    background:rgba(255,255,255,.08); border:1px solid var(--line);
    font-size:10px; font-weight:800; color:var(--txt); filter:none;
  }
  .side .abbr{ font-weight:800; font-size:15px; letter-spacing:.5px; overflow:hidden; text-overflow:ellipsis; }
  .side .cards{ font-size:9px; letter-spacing:.5px; }

  .score-box{ display:flex; align-items:center; gap:8px; flex:none; padding:0 2px; }
  .score{ font-size:27px; font-weight:900; font-variant-numeric:tabular-nums; line-height:1; min-width:15px; text-align:center; }
  .score.win{ color:#fff; }
  .score.lose{ color:var(--muted); }
  .comp-logo{ width:24px; height:24px; object-fit:contain; opacity:.92; }

  /* Sous-ligne (tour + tab), centrée, seulement si contenu */
  .subrow{ display:flex; align-items:center; justify-content:center; gap:8px; padding:0 13px 8px; }
  .subrow:empty{ display:none; }
  .pens{ font-size:11px; color:var(--pen); font-weight:700; }
  .round-chip{
    display:inline-block; max-width:220px;
    font-size:9px; font-weight:800; letter-spacing:.5px; text-transform:uppercase;
    padding:2px 8px; border-radius:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    color:rgb(var(--fav-rgb)); background:rgba(var(--fav-rgb),.14); border:1px solid rgba(var(--fav-rgb),.34);
  }

  /* ---- Bannière spéciale (interrompu / pause fraîcheur) --------------- */
  .banner{
    display:none; align-items:center; gap:7px;
    padding:6px 13px; font-weight:800; font-size:12.5px;
    border-top:1px solid var(--line);
  }
  .banner.show{ display:flex; }
  .banner.interrupt{ color:var(--interrupt); background:rgba(255,138,0,.12); }
  .banner.drinks{ color:#7fdfff; background:rgba(74,168,255,.12); }

  /* ---- Bandeau statistiques (possession / tirs) ----------------------- */
  .stats{ border-top:1px solid var(--line); padding:7px 13px 8px; display:flex; flex-direction:column; gap:5px; }
  .stat-poss{ display:flex; align-items:center; gap:8px; font-size:11px; font-weight:800; font-variant-numeric:tabular-nums; }
  .stat-poss .poss-bar{ flex:1; height:6px; border-radius:4px; overflow:hidden; background:var(--live); }
  .stat-poss .poss-bar i{ display:block; height:100%; background:rgb(var(--fav-rgb)); }
  .stat-row{ display:flex; align-items:center; justify-content:space-between; font-size:11px; }
  .stat-row span:first-child, .stat-row span:last-child{ font-weight:800; min-width:26px; font-variant-numeric:tabular-nums; }
  .stat-row span:first-child{ text-align:left; } .stat-row span:last-child{ text-align:right; }
  .stat-row .stat-lbl{ flex:1; text-align:center; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; font-size:9.5px; font-weight:700; }

  /* ---- Liste des événements ------------------------------------------- */
  .events{ border-top:1px solid var(--line); overflow:hidden; }
  .events:empty{ display:none; }
  .evt{
    display:flex; align-items:center; gap:7px;
    padding:5px 13px; font-size:12.5px; border-bottom:1px solid rgba(255,255,255,.04);
    animation:evtIn .35s ease;
  }
  @keyframes evtIn{ from{opacity:0; transform:translateX(-6px)} to{opacity:1; transform:none} }
  .evt:last-child{ border-bottom:none; }
  .evt .emo{ width:18px; text-align:center; }
  .evt .min{ font-variant-numeric:tabular-nums; color:var(--muted); min-width:32px; font-weight:700; }
  .evt .min.card{ color:var(--live); }
  .evt .eabbr{ font-weight:800; min-width:34px; }
  .evt .who{ flex:1; color:var(--txt); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .evt .tag{
    font-size:9.5px; font-weight:800; letter-spacing:.4px;
    padding:2px 5px; border-radius:5px; background:rgba(255,255,255,.10); color:var(--muted);
  }
  .evt .tag.pen{ background:rgba(74,168,255,.22); color:#9fd0ff; }
  .evt .tag.cf{ background:rgba(245,181,10,.20); color:#ffd97a; }
  .evt .tag.csc{ background:rgba(255,59,70,.20); color:#ff9aa0; }
  .evt .tag.miss{ background:rgba(255,59,70,.20); color:#ff9aa0; }

  .meta{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    padding:6px 13px; font-size:10.5px; color:var(--muted);
    border-top:1px solid var(--line);
  }
  .meta .cd{ color:var(--upcoming); font-weight:800; font-variant-numeric:tabular-nums; }
  .meta-right{ display:flex; align-items:center; gap:7px; }
  .brand-mark{ width:14px; height:14px; opacity:.8; }
  .fresh{ font-size:9px; line-height:1; color:var(--finished); }
  .fresh.warn{ color:var(--interrupt); } .fresh.bad{ color:var(--live); }
  .dots{ display:flex; gap:4px; }
  .dots i{ width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.25); }
  .dots i.on{ background:rgb(var(--fav-rgb)); }

  /* ---- Mode compact : pilule qui épouse le contenu --------------------- */
  .scorebug.compact{ width:auto; }
  .scorebug.compact .bug-main{ padding:9px 14px; }
  .scorebug.compact .side{ flex:0 0 auto; }
  .scorebug.compact .round-chip{ display:none; }

  /* ---- État vide ------------------------------------------------------- */
  .empty{
    padding:14px 16px; font-size:13px; color:var(--muted);
    display:flex; align-items:center; gap:8px;
  }

  /* ---- Célébration de but (carte autonome, jamais clippée) ------------ */
  .cel{ position:fixed; left:50%; z-index:40; pointer-events:none; transform:translateX(-50%); }
  .cel.pos-top-left, .cel.pos-top-right, .cel.pos-top-center{ top:88px; }
  .cel.pos-bottom-left, .cel.pos-bottom-right, .cel.pos-bottom-center{ bottom:108px; }
  .cel .cel-inner{
    display:flex; flex-direction:column; align-items:center; gap:7px; text-align:center;
    position:relative; overflow:hidden; min-width:210px;
    background:linear-gradient(165deg,var(--bg),var(--bg2));
    border:1px solid rgba(var(--cel-rgb,var(--fav-rgb)),.55);
    border-radius:18px; padding:18px 34px;
    box-shadow:0 0 42px rgba(var(--cel-rgb,var(--fav-rgb)),.35), 0 18px 50px rgba(0,0,0,.6);
  }
  .cel .cel-ball{ font-size:30px; line-height:1; }
  .cel .cel-word{
    font-size:40px; font-weight:900; letter-spacing:1.5px; line-height:1;
    background:linear-gradient(180deg,#f2fff7 8%, rgb(var(--cel-rgb,var(--fav-rgb))) 92%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .cel .cel-team{ display:flex; align-items:center; gap:7px; font-size:15px; font-weight:800; letter-spacing:.5px; color:rgb(var(--cel-rgb,var(--fav-rgb))); margin-top:2px; }
  .cel .cel-team img{ width:22px; height:22px; object-fit:contain; }
  .cel .cel-scorer{ font-size:13px; font-weight:700; color:var(--txt); }
  .cel .cel-scorer .cel-min{ color:var(--muted); font-weight:800; }
  .cel .cel-score{ display:flex; align-items:center; gap:7px; font-size:15px; color:var(--muted); margin-top:1px; }
  .cel .cel-score small{ font-size:12px; font-weight:800; letter-spacing:.5px; color:var(--muted); }
  .cel .cel-score b{ font-size:26px; font-weight:900; color:#fff; font-variant-numeric:tabular-nums; }
  .cel{ animation:celIn .5s cubic-bezier(.2,.9,.25,1.2); }
  .cel.out{ animation:celOut .4s ease forwards; }
  @keyframes celIn{ from{opacity:0; transform:translate(-50%,14px) scale(.92)} to{opacity:1; transform:translate(-50%,0) scale(1)} }
  @keyframes celOut{ to{opacity:0; transform:translate(-50%,-10px)} }
  .cel .cel-inner::after{
    content:""; position:absolute; inset:0; transform:translateX(-130%);
    background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.18) 50%,transparent 70%);
    animation:celShine 1.1s ease .25s;
  }
  @keyframes celShine{ to{ transform:translateX(130%); } }
  body.no-anim .cel{ animation:none; } body.no-anim .cel .cel-inner::after{ display:none; }

  /* ---- Thèmes ---------------------------------------------------------- */
  body.theme-glass .scorebug{
    backdrop-filter:blur(14px);
    background:linear-gradient(160deg,rgba(11,14,26,.6),rgba(20,24,42,.5));
    border-color:rgba(255,255,255,.18);
  }
  body.theme-broadcast .scorebug{ background:#0b0e1a; border-radius:8px; backdrop-filter:none; box-shadow:0 14px 36px rgba(0,0,0,.6); }
  body.theme-broadcast .topbar{ height:8px; }
  body.theme-minimal .events, body.theme-minimal .meta, body.theme-minimal .stats{ display:none; }

  /* ---- Toggle langue : discret, visible au survol seulement ----------- */
  #langToggle{
    position:fixed; top:6px; right:8px; display:flex; gap:4px;
    opacity:0; transition:opacity .25s; pointer-events:auto; z-index:10;
  }
  #stage:hover #langToggle{ opacity:.85; }
  #langToggle button{
    background:rgba(11,14,26,.9); color:#cdd4f0; border:1px solid var(--line);
    border-radius:6px; font-size:10px; font-weight:800; padding:3px 7px; cursor:pointer;
  }
  #langToggle button.active{ background:var(--accent); color:#fff; }

  /* Garde-fou téléphone (aperçu hors OBS) */
  @media (max-width:480px){
    #wrap{ max-width:calc(100vw - 24px); }
    .scorebug{ width:min(410px, calc(100vw - 24px)); }
    .cel .cel-inner{ max-width:calc(100vw - 24px); }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="langToggle">
    <button data-lang="fr">FR</button>
    <button data-lang="en">EN</button>
  </div>
  <div id="wrap" class="pos-bottom-left"><div id="root"></div></div>
</div>

<script>
/* =======================================================================
   OVERLAY — tout est inline pour être 100% autonome et robuste.
   ======================================================================= */
(function(){
  'use strict';

  /* ===== LA constante de compétition ===== */
  var LEAGUE_SLUG = 'uefa.champions';
  var BASE = 'https://site.api.espn.com/apis/site/v2/sports/soccer/' + LEAGUE_SLUG;
  var FALLBACK_COMP_LOGO = 'https://a.espncdn.com/i/leaguelogos/soccer/500/2.png';

  /* ---- mini i18n (clé localStorage partagée ldc_lang) ---- */
  var STR = {
    live:      {fr:'EN DIRECT', en:'LIVE'},
    upcoming:  {fr:'À VENIR',   en:'UPCOMING'},
    finished:  {fr:'TERMINÉ',   en:'FINISHED'},
    intLabel:  {fr:'PAUSE',     en:'HALTED'},
    interrupt: {fr:'⏸ Interrompu', en:'⏸ Interrupted'},
    drinks:    {fr:'💧 Pause fraîcheur', en:'💧 Cooling break'},
    none:      {fr:'Aucun match en direct', en:'No live match'},
    waiting:   {fr:'⚽ En attente de matchs…', en:'⚽ Waiting for matches…'},
    pens:      {fr:'tab', en:'pens'},
    updated:   {fr:'maj', en:'upd'},
    kickoff:   {fr:'coup d’envoi dans', en:'kick-off in'},
    goal:      {fr:'BUT !',     en:'GOAL!'},
    ht:        {fr:'MT',        en:'HT'},
    ft:        {fr:'FT',        en:'FT'},
    tab:       {fr:'TAB',       en:'PENS'},
    rLeague:   {fr:'Phase de ligue', en:'League phase'},
    rPo:       {fr:'Barrages',  en:'Play-offs'},
    rR16:      {fr:'Huitièmes', en:'Round of 16'},
    rQf:       {fr:'Quarts',    en:'Quarter-finals'},
    rSf:       {fr:'Demies',    en:'Semi-finals'},
    rFinal:    {fr:'Finale',    en:'Final'},
    rQual:     {fr:'Qualifications', en:'Qualifying'},
    legHome:   {fr:'Aller',     en:'1st leg'},
    legAway:   {fr:'Retour',    en:'2nd leg'},
    stShots:   {fr:'Tirs',      en:'Shots'},
    stOn:      {fr:'Cadrés',    en:'On target'},
    stCorners: {fr:'Corners',   en:'Corners'}
  };
  function lang(){
    try{ var l=localStorage.getItem('ldc_lang'); if(l==='fr'||l==='en') return l; }catch(e){}
    return 'fr';
  }
  function t(k){ var e=STR[k]; return e? (e[lang()]||e.fr) : k; }

  /* ---- helpers couleur (portés d'espn.js, sans dépendance) ---- */
  function _hexToRgb(hex){
    hex=String(hex||'').replace(/^#/,'').trim();
    if(hex.length===3) hex=hex.replace(/(.)/g,'$1$1');
    if(!/^[0-9a-fA-F]{6}$/.test(hex)) return null;
    return [parseInt(hex.slice(0,2),16),parseInt(hex.slice(2,4),16),parseInt(hex.slice(4,6),16)];
  }
  function _rgbToHsl(r,g,b){
    r/=255;g/=255;b/=255; var mx=Math.max(r,g,b),mn=Math.min(r,g,b),h,s,l=(mx+mn)/2;
    if(mx===mn){h=s=0;} else { var d=mx-mn; s=l>0.5? d/(2-mx-mn):d/(mx+mn);
      switch(mx){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;default:h=(r-g)/d+4;} h/=6; }
    return [h,s,l];
  }
  function _hslToRgb(h,s,l){
    var r,g,b;
    if(s===0){r=g=b=l;}
    else { var hue=function(p,q,tt){ if(tt<0)tt+=1; if(tt>1)tt-=1; if(tt<1/6)return p+(q-p)*6*tt; if(tt<1/2)return q; if(tt<2/3)return p+(q-p)*(2/3-tt)*6; return p; };
      var q=l<0.5? l*(1+s):l+s-l*s, p=2*l-q; r=hue(p,q,h+1/3); g=hue(p,q,h); b=hue(p,q,h-1/3); }
    return [Math.round(r*255),Math.round(g*255),Math.round(b*255)];
  }
  /* renvoie "r,g,b" lisible sur fond sombre (clampe L 0.52–0.70, S≥0.5), ou null */
  function _legibleRGB(hex){
    var rgb=_hexToRgb(hex); if(!rgb) return null;
    var hsl=_rgbToHsl(rgb[0],rgb[1],rgb[2]);
    var s=Math.max(hsl[1],0.5), l=Math.min(Math.max(hsl[2],0.52),0.70);
    var out=_hslToRgb(hsl[0],s,l); return out[0]+','+out[1]+','+out[2];
  }
  function getFav(){ try{ var f=JSON.parse(localStorage.getItem('ldc_fav')||'null'); return (f&&f.id)?f:null; }catch(e){ return null; } }

  /* ---- params URL ---- */
  var P = new URLSearchParams(location.search);
  function clampNum(v,min,max,dflt){ var n=parseFloat(v); if(isNaN(n)) return dflt; return Math.min(Math.max(n,min),max); }

  var rawTeam=(P.get('team')||'').trim();
  var PINNED='', FAV_ID='', FORCE_LIVE=false;
  if(/^(all|live)$/i.test(rawTeam)){ FORCE_LIVE=true; }
  else if(rawTeam==='' || /^fav(orite)?$/i.test(rawTeam)){
    var fv=getFav();
    if(fv){ PINNED=(fv.abbr||fv.name||''); FAV_ID=fv.id||''; }
  } else { PINNED=rawTeam; }
  var IS_PINNED = !!(PINNED||FAV_ID);

  var POS=(P.get('pos')||'bottom-left').toLowerCase();
  if(['top-left','top-right','bottom-left','bottom-right','top-center','bottom-center'].indexOf(POS)===-1) POS='bottom-left';
  var IS_CENTER = POS.indexOf('center')!==-1;

  var SIZE=(P.get('size')||'md').toLowerCase();
  var SIZE_BASE = SIZE==='sm'?0.85:(SIZE==='lg'?1.25:1);
  var SCALE = clampNum(P.get('scale'),0.5,3,1);
  var MARGIN = Math.round(clampNum(P.get('margin'),0,400,16));

  var HIDE_EMPTY = P.get('hideEmpty')==='1';
  var COMPACT = P.get('compact')==='1';
  var SHOW_EVENTS = P.get('events')!=='0' && !COMPACT;
  var MAX_EVENTS = Math.round(clampNum(P.get('maxEvents'),0,20,12));
  var SHOW_ROUND = P.get('round')!=='0';
  var SHOW_BRAND = P.get('brand')!=='0';
  var STATS = P.get('stats')==='1' && !COMPACT;
  var TEAM_COLORS = P.get('teamColors')==='1';
  var NEXT = P.get('next')==='1';
  var ROTATE = P.get('rotate')!=='0';
  var DEMO = (P.get('demo')||'').toLowerCase();
  var POLL = Math.round(clampNum(P.get('poll'),8,60,18));

  var DATE=(P.get('date')||'').trim(); if(!/^\d{8}$/.test(DATE)) DATE='';

  var THEME=(P.get('theme')||'dark').toLowerCase();
  if(['dark','glass','minimal','broadcast'].indexOf(THEME)===-1) THEME='dark';
  if(THEME!=='dark') document.body.classList.add('theme-'+THEME);
  if(THEME==='broadcast') TEAM_COLORS=true;

  var ANIM = P.get('anim')!=='0';
  try{ if(window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches) ANIM=false; }catch(e){}
  if(!ANIM) document.body.classList.add('no-anim');

  var urlLang=(P.get('lang')||'').toLowerCase();
  if(urlLang==='fr'||urlLang==='en'){ try{ localStorage.setItem('ldc_lang',urlLang); }catch(e){} }

  /* accent : ?accent → couleur favori → or */
  (function resolveAccent(){
    var acc=(P.get('accent')||'').replace(/^%23/i,'').replace(/^#/,'');
    var rgb = acc? _legibleRGB(acc) : null;
    if(!rgb){ var f=getFav(); if(f&&f.color) rgb=_legibleRGB(f.color); }
    if(rgb) document.documentElement.style.setProperty('--fav-rgb', rgb);
  })();

  /* chroma key : fond uni du body (préserve l'invariant transparent par défaut) */
  (function chroma(){
    var c=(P.get('chroma')||'').replace(/^%23/i,'').replace(/^#/,'');
    if(/^[0-9a-fA-F]{6}$/.test(c)) document.body.style.setProperty('background','#'+c,'important');
  })();

  /* ---- placement (compose centrage + échelle) ---- */
  var wrap=document.getElementById('wrap');
  (function applyPlacement(){
    wrap.className='pos-'+POS;
    if(POS.indexOf('top')===0){ wrap.style.top=MARGIN+'px'; wrap.style.bottom='auto'; }
    else { wrap.style.bottom=MARGIN+'px'; wrap.style.top='auto'; }
    if(IS_CENTER){ wrap.style.left='50%'; wrap.style.right='auto'; }
    else if(POS.indexOf('left')!==-1){ wrap.style.left=MARGIN+'px'; wrap.style.right='auto'; }
    else { wrap.style.right=MARGIN+'px'; wrap.style.left='auto'; }
    var s=SCALE*SIZE_BASE;
    wrap.style.transform=(IS_CENTER?'translateX(-50%) ':'')+'scale('+s+')';
  })();

  /* ---- fetch robuste avec timeout ---- */
  function fetchJSON(url, timeout){
    timeout = timeout||10000;
    if(window.AbortSignal && AbortSignal.timeout){
      return fetch(url,{signal:AbortSignal.timeout(timeout),cache:'no-store'}).then(ok);
    }
    var ctrl = (typeof AbortController!=='undefined')? new AbortController():null;
    var o={cache:'no-store'}; if(ctrl) o.signal=ctrl.signal;
    var tm=setTimeout(function(){ if(ctrl) ctrl.abort(); },timeout);
    return fetch(url,o).then(function(r){clearTimeout(tm);return ok(r);},function(e){clearTimeout(tm);throw e;});
  }
  function ok(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }

  /* ---- parsing défensif ---- */
  function num(v){ var n=parseInt(v,10); return isNaN(n)?0:n; }
  function normalize(ev){
    try{
      if(!ev||!ev.competitions||!ev.competitions.length) return null;
      var comp=ev.competitions[0];
      if(!comp||!comp.status||!comp.status.type) return null;
      var cs=comp.competitors||[]; if(cs.length<2) return null;
      var h=cs.filter(function(c){return c.homeAway==='home';})[0]||cs[0];
      var a=cs.filter(function(c){return c.homeAway==='away';})[0]||cs[1];
      if(!h||!a) return null;
      var leg=(comp.leg&&comp.leg.displayValue)|| (comp.leg&&comp.leg.value!=null? (comp.leg.value+'') : '');
      if(!leg){ try{ var nt=(comp.notes||[]).map(function(x){return x.headline||'';}).join(' '); var mm=nt.match(/(1st|2nd)\s*Leg/i); if(mm) leg=mm[0]; }catch(e){} }
      return {
        id:ev.id, date:ev.date,
        dateObj: ev.date? new Date(ev.date):null,
        state:comp.status.type.state||'pre',
        statusName:comp.status.type.name||'',
        shortDetail:comp.status.type.shortDetail||'',
        displayClock:comp.status.displayClock||'',
        seasonSlug:(ev.season&&ev.season.slug)||'',
        evName:ev.name||ev.shortName||'',
        leg:leg,
        home:team(h), away:team(a)
      };
    }catch(e){ return null; }
  }
  function team(c){
    var tm=c.team||{};
    return {
      id:tm.id||'', score:num(c.score),
      shootout:(c.shootoutScore!=null&&c.shootoutScore!=='')?num(c.shootoutScore):null,
      winner:!!c.winner,
      name:tm.displayName||tm.shortDisplayName||'—',
      abbr:(tm.abbreviation||'').toUpperCase()||'—',
      logo:tm.logo||'',
      color:tm.color||''
    };
  }
  function matchesPinned(m){
    if(FAV_ID && (m.home.id===FAV_ID||m.away.id===FAV_ID)) return true;
    if(!PINNED) return false;
    var q=PINNED.toLowerCase();
    function hit(c){ return c.abbr.toLowerCase()===q || c.name.toLowerCase().indexOf(q)!==-1; }
    return hit(m.home)||hit(m.away);
  }
  function isInterrupted(m){ return /STATUS_(DELAYED|SUSPENDED|ABANDONED|POSTPONED|CANCEL)/.test(m.statusName); }

  /* ---- tour / manche ---- */
  function classifyRound(slug,name){
    var s=(slug||'').toLowerCase();
    if(s){
      if(/final/.test(s)&&!/semi|quarter/.test(s)) return 'final';
      if(/semifinal/.test(s)) return 'sf';
      if(/quarterfinal/.test(s)) return 'qf';
      if(/round-of-(16|32)|last-16/.test(s)) return 'r16';
      if(/knockout|play-?off|playoff/.test(s)) return 'po';
      if(/league|group/.test(s)) return 'league';
      if(/qualif/.test(s)) return 'qualifying';
    }
    var n=(name||'').toLowerCase();
    if(/\bfinal\b/.test(n)&&!/semi|quarter/.test(n)) return 'final';
    if(/semi/.test(n)) return 'sf';
    if(/quarter/.test(n)) return 'qf';
    if(/round of 16|last 16|1\/8/.test(n)) return 'r16';
    if(/play-?off|barrage/.test(n)) return 'po';
    return '';
  }
  function roundLabel(m){
    var r=classifyRound(m.seasonSlug,m.evName);
    var map={league:'rLeague',po:'rPo',r16:'rR16',qf:'rQf',sf:'rSf',final:'rFinal',qualifying:'rQual'};
    if(!map[r]) return '';
    var lbl=t(map[r]);
    if(m.leg){ if(/1/.test(m.leg)) lbl+=' · '+t('legHome'); else if(/2/.test(m.leg)) lbl+=' · '+t('legAway'); }
    return lbl;
  }

  /* ---- horloge "90'+3'" + états MT/FT/TAB/prolongations ---- */
  function clockHTML(m){
    var name=(m.statusName||'').toUpperCase();
    if(m.state==='post'){ if(/PEN|SHOOTOUT/.test(name)) return esc(t('tab')); return esc(t('ft')); }
    if(m.state==='pre') return '–';
    if(/HALFTIME/.test(name)) return esc(t('ht'));
    if(/PEN|SHOOTOUT/.test(name)) return esc(t('tab'));
    var dc=m.displayClock||'';
    if(!dc) return "0'";
    var et=/OVERTIME|EXTRA/.test(name);
    var i=dc.indexOf('+');
    var base = i===-1? esc(dc) : esc(dc.slice(0,i))+'<span class="extra">'+esc(dc.slice(i))+'</span>';
    return base + (et? '<span class="etbadge">ET</span>':'');
  }
  function clockMinute(dc){
    if(!dc) return 0;
    var mt=dc.match(/(\d+)/g); if(!mt) return 0;
    var base=parseInt(mt[0],10)||0;
    var extra=mt[1]?(parseInt(mt[1],10)||0):0;
    return base + extra/100;
  }

  /* ---- mapping type d'événement -> emoji + tag ---- */
  function mapEvent(e){
    var x=(e.typeText||'').toLowerCase();
    var o={emoji:'•', tag:'', tagClass:'', card:false, hidden:false};
    if(x.indexOf('yellow card')!==-1){ o.emoji='🟨'; o.card=true; }
    else if(x.indexOf('red card')!==-1){ o.emoji='🟥'; o.card=true; }
    else if(x.indexOf('own goal')!==-1){ o.emoji='⚽'; o.tag='CSC'; o.tagClass='csc'; }
    else if(x.indexOf('penalty')!==-1 && /(miss|saved|fail)/.test(x)){ o.emoji='❌'; o.tag='PEN✗'; o.tagClass='miss'; }
    else if(x.indexOf('penalty')!==-1){ o.emoji='⚽'; o.tag='PEN'; o.tagClass='pen'; }
    else if(x.indexOf('free')!==-1 && x.indexOf('goal')!==-1){ o.emoji='⚽'; o.tag='CF'; o.tagClass='cf'; }
    else if(x.indexOf('goal')!==-1){ o.emoji='⚽'; }
    else if(x.indexOf('substitution')!==-1){ o.emoji='🔁'; }
    else if(x.indexOf('start delay')!==-1){ o.emoji= /drink/.test(x)?'💧':'⏸'; }
    else if(x.indexOf('end delay')!==-1){ o.emoji='▶️'; }
    else if(x.indexOf('var')!==-1){ o.emoji='📺'; }
    else { o.hidden=true; }
    return o;
  }
  function drinksBreak(keyEvents){
    var inDelay=false, drinks=false;
    keyEvents.forEach(function(e){
      var x=(e.typeText||'').toLowerCase();
      if(x.indexOf('start delay')!==-1){ inDelay=true; drinks=/drink/.test(x); }
      else if(x.indexOf('end delay')!==-1){ inDelay=false; drinks=false; }
    });
    return inDelay && drinks;
  }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  /* =====================================================================
     ÉTAT
     ===================================================================== */
  var compLogo = FALLBACK_COMP_LOGO;
  var matches = [];
  var rotation = [];
  var rotIndex = 0;
  var current = null;
  var summaries = {};        // id -> { ts, keyEvents, stats }
  var prevScore = {};        // id -> {h,a}  (détection but par côté)
  var hasRenderedOnce = false;
  var bugWasVisible = false;
  var lastOkTs = 0, failCount = 0;
  var celTimer = null;

  /* ---- sélection des matchs à afficher ---- */
  function refreshRotation(){
    if(!FORCE_LIVE && IS_PINNED){
      var pin=matches.filter(matchesPinned);
      rotation = pin.length? [pin[0]] : [];
      rotIndex=0; return;
    }
    if(DATE){ rotation = matches.slice(); if(rotIndex>=rotation.length) rotIndex=0; return; }
    rotation = matches.filter(function(m){ return m.state==='in'; });
    if(NEXT && rotation.length===0){
      var up=matches.filter(function(m){ return m.state==='pre' && m.dateObj; })
                    .sort(function(a,b){ return a.dateObj-b.dateObj; });
      if(up.length) rotation=[up[0]];
    }
    if(rotIndex>=rotation.length) rotIndex=0;
  }

  /* =====================================================================
     RÉCUP DONNÉES (avec repli exponentiel)
     ===================================================================== */
  function pollScoreboard(force){
    if(!force && document.visibilityState==='hidden') return Promise.resolve();
    var url=BASE+'/scoreboard'+(DATE?('?dates='+DATE):'');
    return fetchJSON(url).then(function(data){
      lastOkTs=Date.now(); failCount=0;
      try{
        if(data && data.leagues && data.leagues[0] && data.leagues[0].logos && data.leagues[0].logos[0]){
          compLogo = data.leagues[0].logos[0].href || compLogo;
        }
      }catch(e){}
      var evs=(data&&data.events)?data.events:[];
      var norm=[];
      evs.forEach(function(ev){ var m=normalize(ev); if(m) norm.push(m); });
      matches=norm;
      refreshRotation();
      if(!current || indexById(rotation,current.id)===-1) current = rotation[0]||null;
      render();
      detectGoals();
      if(current) pollSummary(current.id, true);
    }).catch(function(){
      failCount++;
      if(!hasRenderedOnce) render();
    });
  }
  function indexById(arr,id){ for(var i=0;i<arr.length;i++){ if(arr[i].id===id) return i; } return -1; }

  function loopScoreboard(force){
    pollScoreboard(force).then(reschedule, reschedule);
    function reschedule(){
      var delay=Math.min(POLL*1000*Math.pow(2,Math.min(failCount,3)), 180000);
      setTimeout(function(){ loopScoreboard(false); }, delay);
    }
  }

  function pollSummary(eventId, force){
    if(!eventId) return;
    var hit=summaries[eventId];
    if(hit && !force && (Date.now()-hit.ts)<Math.max(8000,(POLL-6)*1000)) return;
    fetchJSON(BASE+'/summary?event='+encodeURIComponent(eventId)).then(function(data){
      var raw=(data&&(data.keyEvents||data.plays))||[];
      var list=[];
      raw.forEach(function(e){
        try{
          var p=(e.participants&&e.participants[0]&&e.participants[0].athlete)||null;
          list.push({
            typeText:(e.type&&e.type.text)||'',
            clock:(e.clock&&e.clock.displayValue)||'',
            teamId:(e.team&&e.team.id)||'',
            player:p?p.displayName:''
          });
        }catch(err){}
      });
      var stats=null;
      try{
        var box=data&&data.boxscore;
        if(box&&box.teams&&box.teams.length>=2){
          stats={};
          box.teams.forEach(function(tb){
            var id=tb.team&&tb.team.id; if(!id) return;
            var o={}; (tb.statistics||[]).forEach(function(s){ if(s&&s.name) o[s.name]=s.displayValue; });
            stats[id]=o;
          });
        }
      }catch(e){ stats=null; }
      summaries[eventId]={ts:Date.now(), keyEvents:list, stats:stats};
      if(current && current.id===eventId) render();
    }).catch(function(){ /* garder l'existant */ });
  }

  /* =====================================================================
     DÉTECTION DE BUT + CÉLÉBRATION
     ===================================================================== */
  function detectGoals(){
    matches.forEach(function(m){
      if(m.state!=='in'){ prevScore[m.id]={h:m.home.score,a:m.away.score}; return; }
      var ps=prevScore[m.id];
      if(ps){
        var side = m.home.score>ps.h ? 'home' : (m.away.score>ps.a ? 'away' : null);
        if(side && current && current.id===m.id){
          var bug=document.getElementById('bug');
          if(bug){ bug.classList.add('goal-flash','bump'); setTimeout(function(){ try{bug.classList.remove('goal-flash','bump');}catch(e){} },1200); }
          celebrateGoal(m, side);
        }
      }
      prevScore[m.id]={h:m.home.score,a:m.away.score};
    });
  }

  function celebrateGoal(m, side){
    if(COMPACT) return;
    var stage=document.getElementById('stage');
    var team = side==='home'? m.home : m.away;
    var ke=(summaries[m.id]&&summaries[m.id].keyEvents)||[];
    var scorer='', minute='';
    var goals=ke.filter(function(e){ var mp=mapEvent(e); return mp.emoji==='⚽' && e.teamId===team.id; });
    if(goals.length){ var g=goals[goals.length-1]; scorer=g.player||''; minute=g.clock||''; }

    var old=document.getElementById('cel'); if(old) old.remove();
    if(celTimer){ clearTimeout(celTimer); celTimer=null; }

    var cel=document.createElement('div');
    cel.id='cel'; cel.className='cel pos-'+POS;
    var tc = team.color? _legibleRGB(team.color):null;
    if(tc) cel.style.setProperty('--cel-rgb', tc);
    cel.innerHTML='<div class="cel-inner">'+
        '<div class="cel-ball">⚽</div>'+
        '<div class="cel-word">'+esc(t('goal'))+'</div>'+
        '<div class="cel-team">'+(team.logo?'<img src="'+esc(team.logo)+'" alt="" onerror="this.style.display=\'none\'">':'')+'<span>'+esc(team.abbr)+'</span></div>'+
        (scorer? '<div class="cel-scorer">'+esc(scorer)+(minute?' <span class="cel-min">'+esc(minute)+'</span>':'')+'</div>' : '')+
        '<div class="cel-score"><small>'+esc(m.home.abbr)+'</small><b>'+m.home.score+'</b><span>–</span><b>'+m.away.score+'</b><small>'+esc(m.away.abbr)+'</small></div>'+
      '</div>';
    stage.appendChild(cel);
    celTimer=setTimeout(function(){
      try{ cel.classList.add('out'); setTimeout(function(){ try{cel.remove();}catch(e){} }, ANIM?420:0); }catch(e){}
    }, 4500);
  }

  /* =====================================================================
     RENDU
     ===================================================================== */
  function render(){
    hasRenderedOnce=true;
    var root=document.getElementById('root');

    if(!current){
      bugWasVisible=false;
      if(HIDE_EMPTY){ root.innerHTML=''; return; }
      root.innerHTML='<div class="scorebug"><div class="topbar upcoming"></div>'+
        '<div class="empty">'+esc(matches.length? t('none') : t('waiting'))+'</div></div>';
      return;
    }

    var m=current;
    var stateKey = isInterrupted(m)?'interrupt':(m.state==='in'?'live':(m.state==='post'?'finished':'upcoming'));
    var stateLabel = stateKey==='interrupt'? t('intLabel') : t(stateKey==='live'?'live':stateKey==='finished'?'finished':'upcoming');

    var ke=(summaries[m.id]&&summaries[m.id].keyEvents)||[];

    var cards=cardCounts(ke);
    var homeCards=cardStr(cards[m.home.id]);
    var awayCards=cardStr(cards[m.away.id]);

    var hWin = m.state==='post' && (m.home.winner || (m.home.shootout!=null&&m.away.shootout!=null&&m.home.shootout>m.away.shootout) || (m.home.shootout==null&&m.home.score>m.away.score));
    var aWin = m.state==='post' && (m.away.winner || (m.home.shootout!=null&&m.away.shootout!=null&&m.away.shootout>m.home.shootout) || (m.home.shootout==null&&m.away.score>m.home.score));

    var pensLine='';
    if(m.home.shootout!=null && m.away.shootout!=null){
      pensLine='<div class="pens">'+t('pens')+' '+m.home.shootout+'–'+m.away.shootout+'</div>';
    }

    var rdLabel = SHOW_ROUND? roundLabel(m) : '';
    var roundChip = rdLabel? '<div class="round-chip">'+esc(rdLabel)+'</div>' : '';

    var bannerHTML='';
    if(!COMPACT){
      if(isInterrupted(m)){ bannerHTML='<div class="banner interrupt show">'+esc(t('interrupt'))+'</div>'; }
      else if(m.state==='in' && drinksBreak(ke)){ bannerHTML='<div class="banner drinks show">'+esc(t('drinks'))+'</div>'; }
    }

    var statsHTML = (STATS && m.state!=='pre')? renderStats(m) : '';
    var eventsHTML = SHOW_EVENTS? renderEvents(m, ke) : '';

    var metaHTML='';
    if(!COMPACT){
      var metaLeft = (m.state==='pre' && m.dateObj)
        ? '<span class="cd" data-kickoff="'+m.dateObj.getTime()+'">'+countdown(m.dateObj)+'</span>'
        : '<span>'+esc(t('updated'))+' '+nowHM()+'</span>';
      var dots = rotation.length>1
        ? '<span class="dots">'+rotation.map(function(_,i){return '<i class="'+(i===rotIndex?'on':'')+'"></i>';}).join('')+'</span>'
        : '';
      var brand = SHOW_BRAND? '<img class="brand-mark" src="logo.svg?v=2" alt="" onerror="this.remove()">' : '';
      var fresh = '<span class="fresh" title=""></span>';
      metaHTML='<div class="meta">'+metaLeft+'<span class="meta-right">'+dots+fresh+brand+'</span></div>';
    }

    var mnHTML = (m.state==='pre' && m.dateObj)? fmtKick(m.dateObj) : clockHTML(m);
    var subHTML = COMPACT? '' : '<div class="subrow">'+roundChip+pensLine+'</div>';

    root.innerHTML =
      '<div class="scorebug'+(COMPACT?' compact':'')+(!bugWasVisible&&ANIM?' enter':'')+'" id="bug">'+
        '<div class="topbar '+stateKey+'"></div>'+
        '<div class="bug-main">'+
          '<div class="mn'+(m.state==='in'?' live':'')+'">'+mnHTML+'</div>'+
          sideCol(m.home, 'home', hWin, homeCards)+
          '<div class="score-box">'+
            '<span class="score '+(hWin?'win':(aWin?'lose':''))+'">'+m.home.score+'</span>'+
            '<img class="comp-logo" src="'+esc(compLogo)+'" alt="" onerror="this.style.display=\'none\'">'+
            '<span class="score '+(aWin?'win':(hWin?'lose':''))+'">'+m.away.score+'</span>'+
          '</div>'+
          sideCol(m.away, 'away', aWin, awayCards)+
        '</div>'+
        subHTML+
        bannerHTML+
        statsHTML+
        eventsHTML+
        metaHTML+
      '</div>';

    bugWasVisible=true;
    tickFresh();
  }

  function sideCol(c, side, win, cardsStr){
    var abbrStyle = (TEAM_COLORS && c.color && _legibleRGB(c.color)) ? ' style="color:rgb('+_legibleRGB(c.color)+')"' : '';
    var crest='<img class="crest" data-ab="'+esc(c.abbr)+'" src="'+esc(c.logo)+'" alt="" onerror="_ovCrestErr(this)">';
    var abbr='<span class="abbr"'+abbrStyle+'>'+esc(c.abbr)+'</span>';
    var cards = cardsStr? '<span class="cards">'+cardsStr+'</span>' : '';
    var inner = side==='home' ? (crest+abbr+cards) : (cards+abbr+crest);
    return '<div class="side '+side+'">'+inner+'</div>';
  }
  /* fallback blason : remplace l'image cassée par un pastille avec l'abréviation */
  window._ovCrestErr=function(img){
    try{
      var ab=img.getAttribute('data-ab')||'';
      var s=document.createElement('span');
      s.className='crest fallback'; s.textContent=ab;
      img.parentNode.replaceChild(s,img);
    }catch(e){ try{ img.style.visibility='hidden'; }catch(_){} }
  };

  function cardCounts(ke){
    var map={};
    ke.forEach(function(e){
      var x=(e.typeText||'').toLowerCase();
      if(!e.teamId) return;
      if(!map[e.teamId]) map[e.teamId]={y:0,r:0};
      if(x.indexOf('yellow card')!==-1) map[e.teamId].y++;
      else if(x.indexOf('red card')!==-1) map[e.teamId].r++;
    });
    return map;
  }
  function cardStr(c){
    if(!c) return '';
    var out=[];
    if(c.y) out.push('🟨'+c.y);
    if(c.r) out.push('🟥'+c.r);
    return out.join(' ');
  }

  function renderStats(m){
    try{
      var st=(summaries[m.id]&&summaries[m.id].stats); if(!st) return '';
      var h=st[m.home.id]||{}, a=st[m.away.id]||{};
      function n(v){ var x=parseFloat(v); return isNaN(x)?null:x; }
      var hp=n(h.possessionPct), ap=n(a.possessionPct);
      if(hp==null && ap!=null) hp=100-ap; if(ap==null && hp!=null) ap=100-hp;
      var out='';
      if(hp!=null && ap!=null){
        var hpc=Math.max(0,Math.min(100,hp));
        out+='<div class="stat-poss"><span>'+Math.round(hp)+'%</span>'+
             '<div class="poss-bar"><i style="width:'+hpc+'%"></i></div>'+
             '<span>'+Math.round(ap)+'%</span></div>';
      }
      function row(label,key){
        var hv=h[key], av=a[key];
        if((hv==null||hv==='') && (av==null||av==='')) return '';
        return '<div class="stat-row"><span>'+esc(hv||'0')+'</span><span class="stat-lbl">'+esc(label)+'</span><span>'+esc(av||'0')+'</span></div>';
      }
      var rows='';
      rows+=row(t('stShots'),'totalShots');
      rows+=row(t('stOn'),'shotsOnTarget');
      rows+=row(t('stCorners'),'wonCorners');
      if(!out && !rows) return '';
      return '<div class="stats">'+out+rows+'</div>';
    }catch(e){ return ''; }
  }

  function renderEvents(m, ke){
    if(!ke || !ke.length || MAX_EVENTS<=0) return '';
    var rows = ke.map(function(e,i){ return {e:e, i:i, min:clockMinute(e.clock), map:mapEvent(e)}; })
                 .filter(function(r){ return !r.map.hidden; });
    rows.sort(function(a,b){ if(b.min!==a.min) return b.min-a.min; return b.i-a.i; });
    rows = rows.slice(0,MAX_EVENTS);
    if(!rows.length) return '';

    var abbrOf=function(teamId){
      if(teamId===m.home.id) return m.home.abbr;
      if(teamId===m.away.id) return m.away.abbr;
      return '';
    };
    var html=rows.map(function(r){
      var e=r.e, mp=r.map;
      var tag = mp.tag? '<span class="tag '+mp.tagClass+'">'+esc(mp.tag)+'</span>' : '';
      return '<div class="evt">'+
        '<span class="emo">'+mp.emoji+'</span>'+
        '<span class="min'+(mp.card?' card':'')+'">'+esc(e.clock||'')+'</span>'+
        '<span class="eabbr">'+esc(abbrOf(e.teamId))+'</span>'+
        '<span class="who">'+esc(e.player||e.typeText||'')+'</span>'+
        tag+
      '</div>';
    }).join('');
    return '<div class="events" style="max-height:'+(MAX_EVENTS*30)+'px">'+html+'</div>';
  }

  /* ---- compte à rebours ---- */
  function countdown(d){
    var ms=d.getTime()-Date.now();
    if(ms<=0) return "0'";
    var s=Math.floor(ms/1000), h=Math.floor(s/3600), mm=Math.floor((s%3600)/60), ss=s%60;
    function p(n){return n<10?'0'+n:''+n;}
    return (h>0? h+':' : '') + p(mm)+':'+p(ss);
  }
  function nowHM(){ var d=new Date(); function p(n){return n<10?'0'+n:''+n;} return p(d.getHours())+':'+p(d.getMinutes()); }
  function fmtKick(d){ function p(n){return n<10?'0'+n:''+n;} return p(d.getHours())+':'+p(d.getMinutes()); }

  /* ---- ticking 1s : countdown + fraîcheur ---- */
  function tickCountdown(){
    try{
      var el=document.querySelector('.cd[data-kickoff]');
      if(el){ var ts=parseInt(el.getAttribute('data-kickoff'),10); if(!isNaN(ts)) el.textContent=countdown(new Date(ts)); }
    }catch(e){}
  }
  function tickFresh(){
    try{
      var el=document.querySelector('.fresh'); if(!el) return;
      if(DATE){ el.style.display='none'; return; }   // mode revue : pas de fraîcheur "live"
      if(!lastOkTs){ el.className='fresh'; el.textContent='○'; return; }
      var age=(Date.now()-lastOkTs)/1000;
      var cls = age<40?'ok':(age<90?'warn':'bad');
      el.className='fresh '+cls; el.textContent='●';
      el.title=t('updated')+' '+Math.round(age)+'s';
    }catch(e){}
  }

  /* ---- rotation entre matchs ---- */
  function rotate(){
    try{
      if(!ROTATE || rotation.length<=1) return;
      rotIndex=(rotIndex+1)%rotation.length;
      current=rotation[rotIndex];
      render();
      if(current) pollSummary(current.id,false);
    }catch(e){}
  }

  /* ---- toggle langue + sync inter-onglets ---- */
  Array.prototype.forEach.call(document.querySelectorAll('#langToggle button'),function(b){
    b.addEventListener('click',function(){
      try{ localStorage.setItem('ldc_lang', b.getAttribute('data-lang')); }catch(e){}
      markLang(); render();
    });
  });
  function markLang(){
    Array.prototype.forEach.call(document.querySelectorAll('#langToggle button'),function(b){
      b.classList.toggle('active', b.getAttribute('data-lang')===lang());
    });
    document.documentElement.setAttribute('lang', lang());
  }
  window.addEventListener('storage',function(e){ if(e&&e.key==='ldc_lang'){ markLang(); render(); } });

  /* =====================================================================
     BOUCLES (avec try/catch)
     ===================================================================== */
  markLang();
  render();
  loopScoreboard(true);   // 1er fetch toujours exécuté (même si OBS charge la source en arrière-plan)

  setInterval(function(){ try{ if(document.visibilityState!=='hidden' && current) pollSummary(current.id,false);}catch(e){} }, Math.max(8000,(POLL-6)*1000));
  setInterval(function(){ try{ rotate(); }catch(e){} }, 10000);
  setInterval(function(){ try{ tickCountdown(); tickFresh(); }catch(e){} }, 1000);

  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible'){ try{ pollScoreboard(); }catch(e){} }
  });

  /* ---- prévisualisation de la célébration (?demo=goal, en boucle) ---- */
  if(DEMO==='goal'){
    var demoGoal=function(){
      try{
        var m=current;
        if(!m){
          m={ id:'demo', state:'in',
              home:{id:'h',abbr:'PSG',score:1,logo:'https://a.espncdn.com/i/teamlogos/soccer/500/160.png',color:'011F68'},
              away:{id:'a',abbr:'INT',score:0,logo:'https://a.espncdn.com/i/teamlogos/soccer/500/110.png',color:'00239c'} };
        }
        summaries[m.id]=summaries[m.id]||{ts:Date.now(),keyEvents:[{typeText:'Goal',clock:"23'",teamId:m.home.id,player:'Demo Player'}],stats:null};
        celebrateGoal(m, 'home');
      }catch(e){}
    };
    setTimeout(demoGoal, 1200);
    setInterval(demoGoal, 6500);
  }

})();
</script>
</body>
