<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <!-- Fond de la page Club des Nations : globe lumineux quadrillé (méridiens
       et parallèles) entouré d'une couronne de 12 étoiles. Affiché en
       mix-blend-mode screen par pagebg.css. -->
  <defs>
    <radialGradient id="glow" cx="42%" cy="36%" r="70%">
      <stop offset="0%"  stop-color="#9fd0ff" stop-opacity="0.60"/>
      <stop offset="42%" stop-color="#3f7fe0" stop-opacity="0.38"/>
      <stop offset="76%" stop-color="#173a7e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a1430" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rim" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#cfe6ff" stop-opacity="0"/>
      <stop offset="93%" stop-color="#cfe6ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#cfe6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="st" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff6d6"/>
      <stop offset="100%" stop-color="#f5b50a"/>
    </linearGradient>
    <path id="s" d="M0,-50 L12.3,-17 L47.6,-15.5 L20,6.5 L29.4,40.5 L0,21 L-29.4,40.5 L-20,6.5 L-47.6,-15.5 L-12.3,-17 Z"/>
  </defs>

  <circle cx="300" cy="300" r="236" fill="url(#glow)"/>
  <circle cx="300" cy="300" r="234" fill="url(#rim)"/>

  <!-- quadrillage du globe -->
  <g fill="none" stroke="#cfe6ff" stroke-opacity="0.30" stroke-width="1.6">
    <ellipse cx="300" cy="300" rx="234" ry="234"/>
    <ellipse cx="300" cy="300" rx="168" ry="234"/>
    <ellipse cx="300" cy="300" rx="92" ry="234"/>
    <line x1="300" y1="66" x2="300" y2="534"/>
    <line x1="66" y1="300" x2="534" y2="300"/>
    <path d="M96 186 Q300 222 504 186"/>
    <path d="M96 414 Q300 378 504 414"/>
    <path d="M150 112 Q300 136 450 112"/>
    <path d="M150 488 Q300 464 450 488"/>
  </g>

  <!-- couronne de 12 étoiles -->
  <g fill="url(#st)" opacity="0.9">
    <use href="#s" transform="translate(300,22) scale(0.36)"/>
    <use href="#s" transform="translate(439,59) scale(0.36)"/>
    <use href="#s" transform="translate(541,161) scale(0.36)"/>
    <use href="#s" transform="translate(578,300) scale(0.36)"/>
    <use href="#s" transform="translate(541,439) scale(0.36)"/>
    <use href="#s" transform="translate(439,541) scale(0.36)"/>
    <use href="#s" transform="translate(300,578) scale(0.36)"/>
    <use href="#s" transform="translate(161,541) scale(0.36)"/>
    <use href="#s" transform="translate(59,439) scale(0.36)"/>
    <use href="#s" transform="translate(22,300) scale(0.36)"/>
    <use href="#s" transform="translate(59,161) scale(0.36)"/>
    <use href="#s" transform="translate(161,59) scale(0.36)"/>
  </g>
</svg>
