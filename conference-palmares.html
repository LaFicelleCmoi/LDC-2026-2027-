  </a>
  <nav class="nav">
    <a href="conference.html" data-i18n="nav.dashboard">Accueil</a>
    <a href="conference-classement.html" data-i18n="nav.tracker">Classement</a>
    <a href="conference-calendrier.html" data-i18n="nav.calendar">Calendrier</a>

    <a href="conference-jeu.html" data-noseason data-i18n="nav.game">Jeu</a>

    <span id="liveFlag" style="display:none;font-size:11px;font-weight:800;color:var(--live);"><span class="dot live"></span></span>
    <div class="lang-switch" id="langSwitch"></div>
  </div>
</header>

<main class="container">
  <h1 class="page-title"><span class="shiny" id="palTitle">Palmarès</span></h1>
  <p class="page-sub" id="palSub"></p>

  <div class="view-switch" id="viewSwitch" role="tablist">
    <span class="vs-thumb" aria-hidden="true"></span>
    <button class="vs-opt active" type="button" data-view="palmares" id="vsPalmares">Palmarès</button>
    <button class="vs-opt" type="button" data-view="wall" id="vsWall">Mur des champions</button>
  </div>

  <div id="viewPalmares">
    <div class="podium pal-wrap" id="podium"></div>
    <div class="card pad pal-wrap">
      <table class="pal-table">
        <thead>
          <tr>
            <th class="c" data-i18n="pal.colRank">Rang</th>
            <th data-i18n="pal.colClub">Club</th>
            <th class="c" data-i18n="pal.colTitles">Titres</th>
            <th class="r" data-i18n="pal.colYears">Années</th>
          </tr>
        </thead>
        <tbody id="palBody"></tbody>
      </table>
    </div>
  </div>

  <div id="viewWall" style="display:none">
    <div class="champ-wall pal-wrap" id="champWall"></div>
  </div>
</main>
