<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Comparateur — Tracker</title>
<meta name="description" content="Comparateur de clubs en Ligue des Champions, Europa League et Conference League : saison en cours, confrontations directes, parcours. Projet de fan non officiel, données ESPN." />
<link rel="icon" href="logo.svg?v=4" type="image/svg+xml" />
<link rel="preconnect" href="https://site.api.espn.com" />
<link rel="preconnect" href="https://a.espncdn.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800;900&display=swap" />
<link rel="stylesheet" href="styles.css?v=22" />
<link rel="stylesheet" href="clubpanel.css?v=8" />
<link rel="stylesheet" href="matchpanel.css?v=3" />
<link rel="stylesheet" href="reactbits.css?v=1" />
<link rel="stylesheet" href="compare.css?v=1" />
<link rel="stylesheet" href="topnav.css?v=3" />
<link rel="stylesheet" href="pagebg.css?v=1" />
<style>:root{ --pg-ball:url('compareball.svg?v=1'); --pg-rgb:245,181,10; --pg-top:#161a36; --pg-mid:#0b1024; --tn-accent:#f5b50a; --tn-ink:#1a1300; }</style>
</head>
<body>
<canvas id="starfield" data-rb aria-hidden="true"></canvas>

<main class="container cmp-page">
  <!-- Barre de navigation des trois coupes (topnav.css) -->
  <div class="topbar">
    <div class="tb-left">
      <a class="dash-brand" href="comparateur.html" aria-label="Comparateur"><span class="db-logo db-pict" aria-hidden="true">⚖</span></a>
      <div class="lang-switch" id="langSwitch"></div>
    </div>
    <nav class="top-nav" aria-label="Navigation">
      <a href="dashboard.html" class="nav-ghost nav-ucl"><img src="logo.svg?v=4" alt="" width="16" height="16"><span id="navUcl">Ligue des Champions</span></a>
      <a href="europa.html" class="nav-ghost nav-uel"><img src="europa.svg?v=2" alt="" width="16" height="16"><span data-i18n="nav.uel">Europa League</span></a>
      <a href="conference.html" class="nav-ghost nav-uecl"><img src="conference.svg?v=1" alt="" width="16" height="16"><span data-i18n="nav.uecl">Conference League</span></a>
      <a href="soiree.html" class="nav-ghost">🌙 <span id="navSr">Soirée européenne</span></a>
      <a href="nations.html" class="nav-ghost">🌍 <span id="navNt">Club des Nations</span></a>
      <a href="france.html" class="nav-ghost"><span class="fr-mini" aria-hidden="true"></span><span id="navFr">France</span></a>
      <a href="allemagne.html" class="nav-ghost"><span class="fr-mini flag-de" aria-hidden="true"></span><span id="navDe">Allemagne</span></a>
      <a href="angleterre.html" class="nav-ghost"><span class="fr-mini flag-en" aria-hidden="true"></span><span id="navEn">Angleterre</span></a>
      <a href="espagne.html" class="nav-ghost"><span class="fr-mini flag-es" aria-hidden="true"></span><span id="navEs">Espagne</span></a>
      <a href="italie.html" class="nav-ghost"><span class="fr-mini flag-it" aria-hidden="true"></span><span id="navIt">Italie</span></a>
      <a href="comparateur.html" class="nav-forward star-border" aria-current="page">⚖ <span id="navCmp">Comparateur</span></a>
    </nav>
  </div>

  <h1 class="page-title"><span class="shiny" id="cmpTitle">Comparateur de clubs</span></h1>
  <p class="page-sub" id="cmpSub"></p>

  <div class="cmp-comps" id="cmpComps" role="group" aria-label="Compétition"></div>
  <div class="cmp-pick">
    <label><span id="cmpLA">Club 1</span><select id="cmpA"></select></label>
    <button type="button" class="cmp-swap" id="cmpSwap" aria-label="Inverser">⇄</button>
    <label><span id="cmpLB">Club 2</span><select id="cmpB"></select></label>
    <button type="button" class="cmp-share" id="cmpShare">Copier le lien</button>
  </div>

  <div class="cmp-head" id="cmpHead"></div>

  <section class="section" aria-labelledby="cmpSeasonT">
    <div class="section-head"><h2 id="cmpSeasonT">Saison</h2></div>
    <div class="card pad cmp-card" id="cmpSeason"><p class="cmp-empty" data-i18n="common.loading">Chargement…</p></div>
  </section>

  <section class="section" aria-labelledby="cmpH2hT">
    <div class="section-head"><h2 id="cmpH2hT">Confrontations</h2></div>
    <div class="card pad cmp-card" id="cmpH2h"></div>
  </section>

  <section class="section" aria-labelledby="cmpPathT">
    <div class="section-head"><h2 id="cmpPathT">Parcours</h2></div>
    <div class="card pad cmp-card" id="cmpPath"></div>
  </section>
</main>

<footer class="site-footer">
  <span data-i18n="legal.intro">Projet de fan, non officiel.</span>
  <a href="legal.html" data-i18n="nav.legal">Mentions légales</a>
</footer>

<script src="i18n.js?v=27"></script>
<script src="standings-engine.js?v=1"></script>
<script src="coefficients2026.js?v=1"></script>
<script src="espn.js?v=28"></script>
<script src="favs.js?v=1"></script>
<script src="schedule.js?v=2"></script>
<script src="thresholds.js?v=3"></script>
<script src="chances.js?v=1"></script>
<script src="clubpanel.js?v=7"></script>
<script src="matchpanel.js?v=4"></script>
<script src="goalalert.js?v=3"></script>
<script src="reactbits.js?v=1"></script>
<script src="ui.js?v=2"></script>
<script src="palette.js?v=1"></script>
<script src="compare.js?v=2"></script>
<script>
  /* Libellés du menu traduits (le reste vient de compare.js). */
  (function(){ function s(){ var en=I18N.getLang()==='en';
    document.getElementById('navUcl').textContent=en?'Champions League':'Ligue des Champions';
    document.getElementById('navFr').textContent='France';
    [['navNt','Club of Nations','Club des Nations'],['navDe','Germany','Allemagne'],['navEn','England','Angleterre'],['navEs','Spain','Espagne'],['navIt','Italy','Italie']].forEach(function(x){ var n=document.getElementById(x[0]); if(n) n.textContent=en?x[1]:x[2]; });
    document.getElementById('navSr').textContent=en?'European night':'Soirée européenne';
    document.getElementById('navCmp').textContent=en?'Compare clubs':'Comparateur';
    }
    s(); window.addEventListener('ldc:langchange', s); })();
</script>
</body>
</html>
