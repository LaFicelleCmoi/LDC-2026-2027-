<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Calendrier — Ligue des Champions</title>
<link rel="icon" href="logo.svg?v=4" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://site.api.espn.com" />
<link rel="preconnect" href="https://a.espncdn.com" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=19" />
<style>
  .cal-wrap{ max-width:920px; }
  /* Filtres */
  .cal-filters{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:20px; }
  /* Bouton flottant « prochain match » */
  .cal-next{ position:fixed; right:16px; bottom:16px; z-index:60; display:inline-flex; align-items:center; gap:7px;
    padding:11px 16px; border:none; border-radius:999px; cursor:pointer; font-family:inherit; font-weight:800; font-size:13px;
    background:linear-gradient(180deg,#ffe9a8,#f7bd39 55%,#d68d06); color:#1a1300;
    box-shadow:0 10px 26px rgba(0,0,0,.45), 0 0 18px rgba(var(--gold-rgb,245,181,10),.35); }
  .cal-next:hover{ filter:brightness(1.06); }
  .cal-select{ flex:1 1 200px; max-width:280px; padding:9px 12px; border-radius:10px; border:1px solid var(--line-2); background:var(--card); color:var(--txt); font-family:inherit; font-size:13px; cursor:pointer; }
  .cal-select:focus{ outline:none; border-color:rgba(245,181,10,.5); }
  .cal-myteam{ display:inline-flex; align-items:center; gap:6px; padding:9px 14px; border-radius:10px; border:1px solid rgba(var(--fav-rgb,245,181,10),.5); background:rgba(var(--fav-rgb,245,181,10),.12); color:rgb(var(--fav-rgb,245,181,10)); font-family:inherit; font-weight:800; font-size:12px; cursor:pointer; transition:.15s; }
  .cal-myteam.active{ background:rgb(var(--fav-rgb,245,181,10)); color:#13203f; border-color:transparent; }
  .cal-myteam:hover{ filter:brightness(1.06); }

  /* Groupes (journées / tours) */
  .cal-group{ margin-bottom:24px; }
  .cal-group-head{ display:flex; align-items:center; gap:10px; margin:0 0 11px; font-family:'Bebas Neue',Impact,sans-serif; font-size:22px; letter-spacing:.04em; color:var(--upcoming); }
  .cal-count{ font-family:"Segoe UI",sans-serif; font-size:11px; font-weight:800; color:var(--muted); background:var(--card); border:1px solid var(--line); border-radius:20px; padding:2px 9px; letter-spacing:0; }

  /* Match */
  .cal-match{ display:grid; grid-template-columns:52px 1fr 64px 1fr 58px; align-items:center; gap:10px; padding:9px 12px; border:1px solid var(--line); border-radius:11px; background:var(--card); }
  .cal-match + .cal-match{ margin-top:8px; }
  .cal-match.is-fav{ border-color:rgba(var(--fav-rgb,245,181,10),.6); background:rgba(var(--fav-rgb,245,181,10),.09); }
  .cal-match.live-row{ border-color:rgba(255,93,108,.55); }
  .cal-date{ font-size:11px; color:var(--muted); text-align:center; line-height:1.3; }
  .cal-leg{ display:block; margin-top:3px; font-size:9px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; padding:1px 2px; border-radius:5px; }
  .cal-leg.a{ color:#9fd0ff; background:rgba(59,123,255,.18); }
  .cal-leg.r{ color:#ffe2a0; background:rgba(245,181,10,.2); }
  .cal-side{ display:flex; align-items:center; gap:8px; min-width:0; }
  .cal-side.home{ flex-direction:row-reverse; text-align:right; }
  .cal-side .nm{ font-weight:700; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cal-side img{ width:22px; height:22px; object-fit:contain; flex-shrink:0; }
  .cal-side .nl{ width:22px; height:22px; flex-shrink:0; display:inline-block; }
  .cal-score{ text-align:center; font-weight:900; font-size:16px; font-variant-numeric:tabular-nums; }
  .cal-score .cal-sep{ opacity:.5; margin:0 2px; }
  .cal-score .cal-vs{ color:var(--muted-2); font-weight:700; }
  .cal-score .pen{ display:block; font-size:9px; color:var(--accent); font-weight:700; }
  .cal-score .cal-agg{ display:block; margin-top:2px; font-size:9px; font-weight:800; letter-spacing:.02em; color:var(--upcoming); white-space:nowrap; }
  .cal-status{ font-size:10px; text-align:center; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .cal-status .live{ color:var(--live); font-weight:800; }
  .cal-status .ft{ color:var(--finished); font-weight:800; }
  .cal-status .cal-time{ color:var(--upcoming); font-weight:800; }

  @media (max-width:560px){
    .cal-match{ grid-template-columns:42px 1fr 56px 1fr; gap:7px; padding:8px 9px; }
    .cal-status{ display:none; }
    .cal-side .nm{ font-size:12px; }
    .cal-group-head{ font-size:19px; }
  }

  /* Dates officielles (intersaison) */
  .sch-intro{ font-size:13.5px; color:var(--muted); line-height:1.5; margin-bottom:22px; }
  .sch-group{ margin-bottom:24px; }
  .sch-head{ font-family:'Bebas Neue',Impact,sans-serif; font-size:21px; letter-spacing:.04em; color:var(--upcoming); margin:0 0 11px; }
  .sch-row{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:10px 14px; border:1px solid var(--line); border-radius:11px; background:var(--card); margin-bottom:7px; }
  .sch-row.final{ border-color:rgba(245,181,10,.5); background:rgba(245,181,10,.09); }
  .sch-ev{ font-weight:700; font-size:13.5px; color:var(--txt); }
  .sch-star{ color:var(--upcoming); margin-right:3px; }
  .sch-d{ color:var(--upcoming); font-weight:800; font-size:13px; white-space:nowrap; text-align:right; }
  @media (max-width:560px){ .sch-row{ flex-direction:column; align-items:flex-start; gap:3px; padding:9px 11px; } .sch-d{ font-size:12px; } }
</style>
</head>
<body>
<div id="cl-ball"></div>
<canvas id="starfield"></canvas>
<header class="site-header">
  <a class="brand" href="dashboard.html">
    <span class="star">★</span>
    <span><span class="t1" data-i18n="app.title">Tracker Ligue des Champions</span><br><span class="t2" data-i18n="app.subtitle">Suivi live non officiel — données ESPN</span></span>
  </a>
  <nav class="nav">
    <a href="dashboard.html" data-i18n="nav.dashboard">Accueil</a>
    <a href="tracker.html" data-i18n="nav.tracker">Classement</a>
    <a href="palmares.html" data-i18n="nav.palmares">Palmarès</a>
    <a href="calendrier.html" class="active" data-i18n="nav.calendar">Calendrier</a>
    <a href="jeu.html" data-i18n="nav.game">Jeu</a>
    <a href="prono.html" data-i18n="nav.prono">Pronos</a>
    <a href="monclub.html" data-i18n="nav.myclub">Mon club</a>
    <div id="seasonDD"></div>
    <a href="overlay.html" data-i18n="nav.overlay">Overlay OBS</a>
    <a href="legal.html" data-i18n="nav.legal">Mentions légales</a>
  </nav>
  <div class="header-right">
    <div class="lang-switch" id="langSwitch"></div>
  </div>
</header>

<div class="container">
  <h1 class="page-title"><span class="shiny" data-i18n="cal.title">Calendrier</span><span class="season-chip" id="season-chip"></span></h1>
  <p class="page-sub" data-i18n="cal.sub">Tous les matchs de la saison, par journée</p>

  <div class="souvenir-banner" id="souvenir-banner">
    <span class="sb-label" id="souvenir-banner-label">Souvenir</span>
    <a href="calendrier.html" data-noseason data-i18n="souvenir.back">← Saison actuelle</a>
  </div>

  <div class="cal-filters cal-wrap">
    <select class="cal-select" id="cal-team"><option value="" data-i18n="cal.allClubs">Tous les clubs</option></select>
    <button class="cal-myteam" id="cal-myteam" style="display:none">★ <span data-i18n="fav.myTeam">Mon équipe</span></button>
    <button class="cal-myteam" id="cal-ics" title="Google Agenda, Apple Calendar, Outlook…">📆 <span id="calIcsLbl">Exporter (.ics)</span></button>
  </div>

  <button class="cal-next" id="cal-next" style="display:none">⤓ <span id="calNextLbl">Prochain match</span></button>

  <div class="cal-wrap" id="cal-body">
    <div class="empty-state" data-i18n="common.loading">Chargement…</div>
  </div>
</div>

<footer class="site-footer">
  <span data-i18n="legal.intro">Projet de fan, non officiel.</span>
  <a href="legal.html" data-i18n="nav.legal">Mentions légales</a>
</footer>

<script src="i18n.js?v=20"></script>
<script src="espn.js?v=12"></script>
<script src="ui.js?v=1"></script>
<script>
(function(){
  'use strict';
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function el(id){ return document.getElementById(id); }
  function pad(n){ return n<10?'0'+n:''+n; }
  function dm(d){ return pad(d.getDate())+'/'+pad(d.getMonth()+1); }
  function hm(d){ return pad(d.getHours())+':'+pad(d.getMinutes()); }

  if(window.I18N) I18N.mountToggle('#langSwitch');
  applyFavAccent();

  var allMatches=[], filterTeam='';

  function applyFavAccent(){ if(!window.ESPN) return; var a=ESPN.favAccent(), root=document.documentElement; if(a) root.style.setProperty('--fav-rgb',a); else root.style.removeProperty('--fav-rgb'); }

  function applySeasonUI(){
    var chip=el('season-chip'), banner=el('souvenir-banner');
    if(chip) chip.textContent=ESPN.seasonLabel();
    if(banner){
      if(ESPN.isArchive()){ banner.classList.add('show'); el('souvenir-banner-label').textContent=I18N.t('souvenir.badge')+' '+ESPN.seasonLabel(); }
      else banner.classList.remove('show');
    }
    ESPN.mountSeasonMenu('#seasonDD','calendrier.html');
    ESPN.preserveSeasonLinks(document);
    var en=I18N.getLang()==='en';
    var il=el('calIcsLbl'); if(il) il.textContent=en?'Export (.ics)':'Exporter (.ics)';
    var nl=el('calNextLbl'); if(nl) nl.textContent=en?'Next match':'Prochain match';
  }

  /* Découpe les matchs de phase de ligue en journées (saut > 5 jours = nouvelle journée). */
  function clusterMatchdays(matches){
    var withDate=matches.filter(function(m){return m.dateObj;}).sort(function(a,b){return a.dateObj-b.dateObj;});
    var groups=[], cur=null, last=null;
    withDate.forEach(function(m){
      var t=m.dateObj.getTime();
      if(last===null || (t-last)>5*86400000){ cur=[]; groups.push(cur); }
      cur.push(m); last=t;
    });
    var noDate=matches.filter(function(m){return !m.dateObj;});
    if(noDate.length) groups.push(noDate);
    return groups;
  }

  function logo(c){ return c.logo?'<img src="'+esc(c.logo)+'" onerror="this.style.visibility=\'hidden\'">':'<span class="nl"></span>'; }
  function side(c,cls){ return '<div class="cal-side '+cls+'">'+logo(c)+'<span class="nm">'+esc(c.shortName||c.name)+'</span></div>'; }

  /* Clé d'une confrontation (tour + paire d'équipes) et cumul des scores sur les 2 manches. */
  function tieKey(m){ var ids=[m.home.teamId,m.away.teamId].sort(); return m.round+'|'+ids.join('::'); }
  function computeAggregates(){
    var agg={};
    allMatches.forEach(function(m){
      if(!m.leg) return;                       // seulement les double confrontations (aller/retour)
      var k=tieKey(m);
      if(!agg[k]) agg[k]={};
      if(m.state!=='pre'){
        agg[k][m.home.teamId]=(agg[k][m.home.teamId]||0)+m.home.score;
        agg[k][m.away.teamId]=(agg[k][m.away.teamId]||0)+m.away.score;
      }
    });
    return agg;
  }

  function matchRow(m,fid,aggMap){
    var isFav = fid && (m.home.teamId===fid || m.away.teamId===fid);
    var pen = (m.home.shootout!=null && m.away.shootout!=null);
    var leg = m.leg===1 ? '<span class="cal-leg a">'+esc(I18N.t('leg.first'))+'</span>'
            : m.leg===2 ? '<span class="cal-leg r">'+esc(I18N.t('leg.second'))+'</span>' : '';
    // Cumul affiché sur le match retour (somme des 2 manches)
    var aggLine='';
    if(m.leg===2 && m.state!=='pre' && aggMap){
      var a=aggMap[tieKey(m)];
      if(a){ var h=a[m.home.teamId], aw=a[m.away.teamId];
        if(h!=null && aw!=null) aggLine='<span class="cal-agg">'+(I18N.getLang()==='en'?'Agg.':'Cumul')+' '+h+'–'+aw+'</span>'; }
    }
    var score, status;
    if(m.state==='pre'){
      score='<span class="cal-vs">–</span>';
      status='<span class="cal-time">'+(m.dateObj?hm(m.dateObj):'')+'</span>';
    } else {
      score=m.home.score+'<span class="cal-sep">–</span>'+m.away.score+(pen?'<span class="pen">'+esc(I18N.t('common.pen'))+' '+m.home.shootout+'–'+m.away.shootout+'</span>':'');
      status = m.state==='in' ? '<span class="live">'+esc(m.displayClock||I18N.t('common.live'))+'</span>'
                              : '<span class="ft">'+esc(I18N.t('common.finished')||'FT')+'</span>';
    }
    return '<div class="cal-match'+(isFav?' is-fav':'')+(m.state==='in'?' live-row':'')+'">'+
      '<div class="cal-date">'+(m.dateObj?dm(m.dateObj):'—')+leg+'</div>'+
      side(m.home,'home')+
      '<div class="cal-score">'+score+aggLine+'</div>'+
      side(m.away,'away')+
      '<div class="cal-status">'+status+'</div>'+
    '</div>';
  }

  /* Dates officielles UEFA 2026-27 (affichées tant que la saison n'a pas commencé) */
  var SCHEDULE = {
    qualif: [
      {fr:'1er tour de qualif.', en:'1st qualifying round', dfr:'7-8 & 14-15 juil. 2026', den:'7-8 & 14-15 Jul 2026'},
      {fr:'2e tour de qualif.',  en:'2nd qualifying round', dfr:'21-22 & 28-29 juil. 2026', den:'21-22 & 28-29 Jul 2026'},
      {fr:'3e tour de qualif.',  en:'3rd qualifying round', dfr:'4-5 & 11 août 2026', den:'4-5 & 11 Aug 2026'},
      {fr:'Barrages',            en:'Play-offs',            dfr:'18-19 & 25-26 août 2026', den:'18-19 & 25-26 Aug 2026'}
    ],
    league: [
      {fr:'Tirage au sort', en:'League phase draw', dfr:'27 août 2026', den:'27 Aug 2026', star:true},
      {fr:'Journée 1', en:'Matchday 1', dfr:'8-9-10 sept. 2026', den:'8-9-10 Sep 2026'},
      {fr:'Journée 2', en:'Matchday 2', dfr:'13-14 oct. 2026', den:'13-14 Oct 2026'},
      {fr:'Journée 3', en:'Matchday 3', dfr:'20-21 oct. 2026', den:'20-21 Oct 2026'},
      {fr:'Journée 4', en:'Matchday 4', dfr:'3-4 nov. 2026', den:'3-4 Nov 2026'},
      {fr:'Journée 5', en:'Matchday 5', dfr:'24-25 nov. 2026', den:'24-25 Nov 2026'},
      {fr:'Journée 6', en:'Matchday 6', dfr:'8-9 déc. 2026', den:'8-9 Dec 2026'},
      {fr:'Journée 7', en:'Matchday 7', dfr:'19-20 janv. 2027', den:'19-20 Jan 2027'},
      {fr:'Journée 8', en:'Matchday 8', dfr:'27 janv. 2027', den:'27 Jan 2027'}
    ],
    ko: [
      {fr:'Tirage des barrages',  en:'Knockout play-off draw', dfr:'29 janv. 2027', den:'29 Jan 2027', star:true},
      {fr:'Barrages',             en:'Knockout play-offs',     dfr:'16-17 & 23-24 févr. 2027', den:'16-17 & 23-24 Feb 2027'},
      {fr:'Tirage phase finale',  en:'Knockout phase draw',    dfr:'26 févr. 2027', den:'26 Feb 2027', star:true},
      {fr:'Huitièmes de finale',  en:'Round of 16',            dfr:'9-10 & 16-17 mars 2027', den:'9-10 & 16-17 Mar 2027'},
      {fr:'Quarts de finale',     en:'Quarter-finals',         dfr:'6-7 & 13-14 avr. 2027', den:'6-7 & 13-14 Apr 2027'},
      {fr:'Demi-finales',         en:'Semi-finals',            dfr:'27-28 avr. & 4-5 mai 2027', den:'27-28 Apr & 4-5 May 2027'},
      {fr:'Finale · Madrid',      en:'Final · Madrid',         dfr:'5 juin 2027 · Estadio Metropolitano', den:'5 Jun 2027 · Estadio Metropolitano', final:true}
    ]
  };
  function renderSchedule(){
    var en=I18N.getLang()==='en';
    function row(it){
      return '<div class="sch-row'+(it.final?' final':'')+'">'+
        '<span class="sch-ev">'+(it.star?'<span class="sch-star">◆</span>':'')+esc(en?it.en:it.fr)+'</span>'+
        '<span class="sch-d">'+esc(en?it.den:it.dfr)+'</span></div>';
    }
    function grp(title,items){ return '<div class="sch-group"><div class="sch-head">'+esc(title)+'</div>'+items.map(row).join('')+'</div>'; }
    return '<div class="sch-intro">'+esc(en?'The 2026-27 season hasn’t started yet — here are all the key dates to remember 📅':'La saison 2026-27 n’a pas encore commencé — voici toutes les dates à retenir 📅')+
      ' <a class="souvenir-link" style="text-decoration:underline;color:var(--upcoming)" href="calendrier.html?season=2025">'+esc(I18N.t('dash.seeSouvenir'))+'</a></div>'+
      grp(en?'Qualifying':'Qualifications', SCHEDULE.qualif)+
      grp(en?'League phase':'Phase de ligue', SCHEDULE.league)+
      grp(en?'Knockout phase':'Phase finale', SCHEDULE.ko);
  }

  /* ---- Export .ics (agenda) : matchs (filtre/favori) ou dates clés officielles ---- */
  var KEY_DATES=[
    {d:'20260707',fr:'1er tour de qualification',en:'1st qualifying round'},
    {d:'20260721',fr:'2e tour de qualification',en:'2nd qualifying round'},
    {d:'20260804',fr:'3e tour de qualification',en:'3rd qualifying round'},
    {d:'20260818',fr:'Barrages (aller)',en:'Play-offs (1st leg)'},
    {d:'20260827',fr:'Tirage de la phase de ligue',en:'League phase draw'},
    {d:'20260908',fr:'Journée 1',en:'Matchday 1'},
    {d:'20261013',fr:'Journée 2',en:'Matchday 2'},
    {d:'20261020',fr:'Journée 3',en:'Matchday 3'},
    {d:'20261103',fr:'Journée 4',en:'Matchday 4'},
    {d:'20261124',fr:'Journée 5',en:'Matchday 5'},
    {d:'20261208',fr:'Journée 6',en:'Matchday 6'},
    {d:'20270119',fr:'Journée 7',en:'Matchday 7'},
    {d:'20270127',fr:'Journée 8',en:'Matchday 8'},
    {d:'20270216',fr:'Barrages de la phase finale',en:'Knockout play-offs'},
    {d:'20270309',fr:'Huitièmes de finale',en:'Round of 16'},
    {d:'20270406',fr:'Quarts de finale',en:'Quarter-finals'},
    {d:'20270427',fr:'Demi-finales',en:'Semi-finals'},
    {d:'20270605',fr:'Finale · Madrid',en:'Final · Madrid'}
  ];
  function icsEscape(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
  function icsDT(d){ return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+'00Z'; }
  function buildICS(){
    var en=I18N.getLang()==='en';
    var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//LDC Tracker//NONSGML//FR','CALSCALE:GREGORIAN'];
    var now=icsDT(new Date()), count=0;
    if(allMatches.length){
      var fav=ESPN.getFav();
      var scope=filterTeam || (fav?fav.id:'');            // priorité au filtre affiché, sinon club favori, sinon tout
      var ms=allMatches.filter(function(m){ return m.round!=='qualifying' && m.dateObj; });
      if(scope){ var scoped=ms.filter(function(m){ return m.home.teamId===scope||m.away.teamId===scope; }); if(scoped.length) ms=scoped; }
      ms.forEach(function(m){
        var end=new Date(m.dateObj.getTime()+2*3600*1000);
        L.push('BEGIN:VEVENT','UID:ldc-'+m.id+'@ldc-tracker','DTSTAMP:'+now,
          'DTSTART:'+icsDT(m.dateObj),'DTEND:'+icsDT(end),
          'SUMMARY:'+icsEscape('⚽ '+m.home.name+' – '+m.away.name),
          'DESCRIPTION:'+icsEscape(en?'Champions League (unofficial tracker)':'Ligue des Champions (tracker non officiel)'),
          'END:VEVENT');
        count++;
      });
    } else {
      KEY_DATES.forEach(function(k){
        L.push('BEGIN:VEVENT','UID:ldc-key-'+k.d+'@ldc-tracker','DTSTAMP:'+now,
          'DTSTART;VALUE=DATE:'+k.d,
          'SUMMARY:'+icsEscape('⭐ '+(en?k.en:k.fr)+' — '+(en?'Champions League':'Ligue des Champions')),
          'END:VEVENT');
        count++;
      });
    }
    L.push('END:VCALENDAR');
    return { text:L.join('\r\n'), count:count };
  }
  function exportICS(){
    var r=buildICS(); if(!r.count) return;
    try{
      var blob=new Blob([r.text],{type:'text/calendar;charset=utf-8'});
      var url=URL.createObjectURL(blob), a=document.createElement('a');
      a.href=url; a.download='ldc-calendrier.ics'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ try{ URL.revokeObjectURL(url); }catch(e){} }, 3000);
    }catch(e){}
  }

  function render(){
    var host=el('cal-body'); if(!host) return;
    var nextBtn=el('cal-next'); if(nextBtn) nextBtn.style.display='none';
    var fav=ESPN.getFav(), fid=fav?fav.id:null;
    var aggMap=computeAggregates();
    if(!allMatches.length){
      host.innerHTML = (!ESPN.isArchive())
        ? renderSchedule()
        : '<div class="empty-state">'+esc(I18N.t('cal.empty'))+'</div>';
      return;
    }
    var matches=allMatches.filter(function(m){return m.round!=='qualifying';});
    if(filterTeam) matches=matches.filter(function(m){return m.home.teamId===filterTeam||m.away.teamId===filterTeam;});
    if(!matches.length){ host.innerHTML='<div class="empty-state">'+esc(I18N.t('cal.empty'))+'</div>'; return; }

    /* prochain match à venir (pour le bouton flottant) */
    var now=Date.now(), nextId=null, nextTs=Infinity;
    matches.forEach(function(m){ if(m.state==='pre'&&m.dateObj&&m.dateObj.getTime()>now&&m.dateObj.getTime()<nextTs){ nextTs=m.dateObj.getTime(); nextId=m.id; } });

    var groups=[];
    var league=matches.filter(function(m){return m.round==='league';});
    clusterMatchdays(league).forEach(function(md,i){ groups.push({title:I18N.t('cal.matchday')+' '+(i+1), matches:md}); });
    var RL={po:'trk.round.po',r16:'trk.round.r16',qf:'trk.round.qf',sf:'trk.round.sf',final:'trk.round.final'};
    ['po','r16','qf','sf','final'].forEach(function(rk){
      var ms=matches.filter(function(m){return m.round===rk;}).sort(function(a,b){return (a.dateObj?a.dateObj.getTime():0)-(b.dateObj?b.dateObj.getTime():0);});
      if(ms.length) groups.push({title:I18N.t(RL[rk])||rk, matches:ms});
    });

    host.innerHTML=groups.map(function(g){
      return '<div class="cal-group"><div class="cal-group-head">'+esc(g.title)+' <span class="cal-count">'+g.matches.length+'</span></div>'+
        g.matches.map(function(m){ return (nextId&&m.id===nextId?'<div id="nextMatchAnchor"></div>':'')+matchRow(m,fid,aggMap); }).join('')+'</div>';
    }).join('');
    if(nextBtn && nextId) nextBtn.style.display='inline-flex';
  }

  function buildFilter(){
    var sel=el('cal-team'); if(!sel) return;
    var map={};
    allMatches.forEach(function(m){ [m.home,m.away].forEach(function(c){ if(c.teamId && !map[c.teamId]) map[c.teamId]={id:c.teamId,name:c.name}; }); });
    var teams=Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){return a.name.localeCompare(b.name);});
    sel.innerHTML='<option value="">'+esc(I18N.t('cal.allClubs'))+'</option>'+
      teams.map(function(t){return '<option value="'+esc(t.id)+'"'+(t.id===filterTeam?' selected':'')+'>'+esc(t.name)+'</option>';}).join('');
    // bouton "Mon équipe"
    var fav=ESPN.getFav(), btn=el('cal-myteam');
    if(btn){
      if(fav && map[fav.id]){ btn.style.display='inline-flex'; btn.classList.toggle('active', filterTeam===fav.id); }
      else btn.style.display='none';
    }
  }

  el('cal-team').addEventListener('change',function(){ filterTeam=this.value; var fav=ESPN.getFav(),btn=el('cal-myteam'); if(btn&&fav) btn.classList.toggle('active', filterTeam===fav.id); render(); });
  el('cal-myteam').addEventListener('click',function(){
    var fav=ESPN.getFav(); if(!fav) return;
    filterTeam = (filterTeam===fav.id) ? '' : fav.id;   // bascule
    el('cal-team').value=filterTeam;
    this.classList.toggle('active', filterTeam===fav.id);
    render();
  });
  el('cal-ics').addEventListener('click', exportICS);
  el('cal-next').addEventListener('click', function(){
    var a=el('nextMatchAnchor'); if(a) a.scrollIntoView({behavior:'smooth', block:'center'});
  });

  function load(){
    ESPN.fetchSeasonEvents().then(function(events){
      allMatches=(events||[]).map(ESPN.normalizeEvent).filter(Boolean);
      buildFilter(); render();
    }).catch(function(){ var h=el('cal-body'); if(h) h.innerHTML='<div class="empty-state">'+esc(I18N.t('common.offline')||'—')+'</div>'; });
  }

  applySeasonUI();
  load();

  if(window.I18N) window.addEventListener('ldc:langchange',function(){ applySeasonUI(); buildFilter(); render(); });

  /* Starfield (fond étoilé partagé) */
  (function starfield(){
    var c=el('starfield'); if(!c||!c.getContext) return; var ctx=c.getContext('2d'); var stars=[], W=0, H=0;
    function resize(){ var dpr=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; c.width=W*dpr; c.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); build(); }
    function build(){ stars=[]; var n=Math.min(110,Math.floor(W*H/14000)); for(var i=0;i<n;i++) stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+0.3,vy:0.04+Math.random()*0.16,tw:Math.random()*6.28}); }
    function loop(){ if(document.visibilityState==='hidden'){ setTimeout(function(){requestAnimationFrame(loop);},700); return; } ctx.clearRect(0,0,W,H); for(var i=0;i<stars.length;i++){ var s=stars[i]; s.y+=s.vy; s.tw+=0.03; if(s.y>H+2){ s.y=-2; s.x=Math.random()*W; } var a=0.16+0.28*Math.sin(s.tw); if(a<0)a=0; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.28); ctx.fillStyle='rgba(150,170,210,'+a.toFixed(2)+')'; ctx.fill(); } requestAnimationFrame(loop); }
    window.addEventListener('resize',resize); resize(); if(!(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)) requestAnimationFrame(loop);
  })();
})();
</script>
</body>
