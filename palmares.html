<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Palmarès — Ligue des Champions</title>
<link rel="icon" href="logo.svg?v=4" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://site.api.espn.com" />
<link rel="preconnect" href="https://a.espncdn.com" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=19" />
<style>
  /* ---- Podium (flat + prestige) ---- */
  .podium{ display:flex; align-items:flex-end; justify-content:center; gap:14px; margin:8px 0 34px; }
  .pod{ position:relative; flex:1 1 0; max-width:250px; border-radius:12px 12px 4px 4px; padding:18px 13px 16px; text-align:center; border:1px solid; border-top-width:4px; overflow:hidden; }
  .pod .medal{ font-size:1.7em; line-height:1; }
  .pod .pname{ font-weight:800; font-size:1em; margin:6px 0 1px; color:#fff; line-height:1.25; }
  .pod .ptitles{ font-family:'Bebas Neue',Impact,sans-serif; font-size:2.7em; line-height:1; letter-spacing:.03em; margin-top:6px; }
  .pod .ptitles small{ font-family:"Segoe UI",sans-serif; font-size:.3em; font-weight:800; letter-spacing:.14em; text-transform:uppercase; vertical-align:middle; opacity:.75; }
  .pod .prank{ position:absolute; right:11px; bottom:4px; font-family:'Bebas Neue',Impact,sans-serif; font-size:2.6em; line-height:1; opacity:.14; }
  .pod.p1{ min-height:218px; background:rgba(245,181,10,.14); border-color:rgba(245,181,10,.45); border-top-color:#f5b50a; }
  .pod.p1 .ptitles{ color:#ffce4a; }
  .pod.p2{ min-height:174px; background:rgba(206,214,232,.10); border-color:rgba(206,214,232,.35); border-top-color:#cfd6e6; }
  .pod.p2 .ptitles{ color:#e3eaf7; }
  .pod.p3{ min-height:146px; background:rgba(224,160,106,.10); border-color:rgba(224,160,106,.35); border-top-color:#e0a06a; }
  .pod.p3 .ptitles{ color:#eab27e; }
  /* Podium cliquable : années de victoire repliées */
  .pod{ transition:transform .18s ease; will-change:transform; }
  .pod.has-detail{ cursor:pointer; }
  .pod.has-detail:hover{ transform:translateY(-2px); }
  .pod-years{ display:none; margin-top:10px; padding-top:9px; border-top:1px solid rgba(255,255,255,.16); font-size:11px; line-height:1.65; color:#eef2fb; }
  .pod-years .pdl{ display:block; font-size:9px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--upcoming); margin-bottom:4px; }
  .pod-years .py-club{ display:block; font-weight:800; color:#fff; margin-top:5px; }
  .pod.open{ z-index:2; }
  .pod.open .pod-years{ display:block; }
  .pod.open .prank{ display:none; }
  @media (max-width:560px){ .podium{ gap:7px; } .pod{ padding:13px 7px 12px; } .pod .pname{ font-size:.78em; } .pod .ptitles{ font-size:2em; } .pod .medal{ font-size:1.4em; } }
  .pal-wrap{ max-width:820px; }
  .pal-table{ width:100%; border-collapse:collapse; }
  .pal-table th{ text-align:left; font-size:11px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--muted); padding:10px 12px; border-bottom:1px solid var(--line-2); }
  .pal-table th.c{ text-align:center; } .pal-table th.r{ text-align:right; }
  .pal-table td{ padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
  .pal-table tr:hover td{ background:rgba(255,255,255,.03); }
  .pal-rank{ font-family:var(--font-d,'Segoe UI'); font-weight:900; font-size:18px; text-align:center; width:58px; color:var(--muted); }
  .pal-rank.m1{ color:#ffd24a; } .pal-rank.m2{ color:#cfd6e6; } .pal-rank.m3{ color:#e0a06a; }
  .pal-club{ font-weight:700; font-size:15px; }
  .pal-club .star{ color:var(--upcoming); margin-right:8px; }
  .pal-titles{ text-align:center; width:96px; }
  .pal-titles b{ font-size:18px; font-weight:900; color:var(--upcoming); }
  .pal-titles .cup{ opacity:.85; }
  .pal-years{ text-align:right; color:var(--muted); font-size:12px; line-height:1.5; }
  .pal-row.top td{ background:linear-gradient(90deg, rgba(245,181,10,.10), transparent 60%); }

  /* Détail "années de victoire" — repliable, révélé au clic sur mobile
     (là où la colonne Années est masquée). */
  .pal-chev{ display:none; }
  .pal-detail{ display:none; }
  .pal-detail > td{ padding:0 12px 12px; }
  .pal-detail-in{ background:rgba(245,181,10,.07); border:1px solid rgba(245,181,10,.28); border-radius:10px; padding:9px 12px; color:#cdd6e0; font-size:12.5px; line-height:1.75; }
  .pal-detail-in .pdl{ display:block; font-size:10px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--upcoming); margin-bottom:3px; }

  @media (max-width:640px){
    .pal-years, .pal-table th.r{ display:none; }
    .pal-titles{ width:72px; }
    .pal-row.has-detail{ cursor:pointer; }
    .pal-row.has-detail td{ -webkit-user-select:none; user-select:none; }
    .pal-chev{ display:inline-block; margin-left:7px; color:var(--muted); font-size:10px; vertical-align:middle; transition:transform .2s, color .2s; }
    .pal-row.open .pal-chev{ transform:rotate(180deg); color:var(--upcoming); }
    .pal-row.open td{ border-bottom-color:transparent; }
    .pal-row.open + .pal-detail{ display:table-row; }
  }

  /* Mur des champions (avec logos) */
  .wall-wrap{ max-width:840px; }
  .champ-wall{ display:grid; grid-template-columns:repeat(auto-fill,minmax(152px,1fr)); gap:9px; }
  .cw-item{ display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:12px;
    background:linear-gradient(150deg, rgba(255,255,255,.05), rgba(255,255,255,.015)); border:1px solid var(--line-2);
    transition:transform .15s, border-color .15s, box-shadow .15s; }
  .cw-item:hover{ transform:translateY(-2px); border-color:rgba(245,181,10,.5); box-shadow:0 6px 18px rgba(0,0,0,.35); }
  .cw-logo{ width:34px; height:34px; object-fit:contain; flex-shrink:0; filter:drop-shadow(0 3px 6px rgba(0,0,0,.55)); }
  .cw-txt{ min-width:0; display:flex; flex-direction:column; }
  .cw-item .yr{ font-family:'Bebas Neue',Impact,sans-serif; font-size:18px; line-height:1; color:var(--upcoming); letter-spacing:.04em; }
  .cw-item .cl{ font-size:12px; font-weight:700; color:var(--txt); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
  .cw-item.fav{ border-color:rgba(var(--fav-rgb,245,181,10),.65); background:rgba(var(--fav-rgb,245,181,10),.12); box-shadow:0 0 0 1px rgba(var(--fav-rgb,245,181,10),.25); }
  .cw-item.fav .yr, .cw-item.fav .cl{ color:rgb(var(--fav-rgb,245,181,10)); }
  @media (max-width:560px){ .champ-wall{ grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:7px; } .cw-logo{ width:28px; height:28px; } .cw-item{ padding:8px 9px; gap:8px; } .cw-item .cl{ font-size:11px; } .cw-item .yr{ font-size:16px; } }

  /* Toggle prestige Palmarès / Mur des champions — or biseauté + reflet + brillance */
  .view-switch{ position:relative; display:inline-flex; max-width:100%; padding:4px; margin:6px 0 26px; border-radius:999px;
    background:linear-gradient(180deg,#0c1430,#13214a);
    border:1px solid rgba(var(--gold-rgb,245,181,10),.4);
    box-shadow:inset 0 1px 4px rgba(0,0,0,.55), 0 0 22px rgba(var(--gold-rgb,245,181,10),.1); }
  .view-switch::before{ content:""; position:absolute; inset:0; border-radius:999px; pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.07),transparent 55%); }
  .view-switch .vs-thumb{ position:absolute; z-index:0; top:4px; left:4px; height:calc(100% - 8px); border-radius:999px; overflow:hidden;
    background:linear-gradient(180deg,#ffe9a8 0%,#f7bd39 55%,#d68d06 100%);
    box-shadow:0 3px 11px rgba(var(--gold-rgb,245,181,10),.55), 0 0 18px rgba(var(--gold-rgb,245,181,10),.3),
      inset 0 1px 0 rgba(255,255,255,.6), inset 0 -1px 2px rgba(120,70,0,.45);
    transition:left .45s cubic-bezier(.34,1.45,.4,1), width .45s cubic-bezier(.34,1.45,.4,1); }
  .view-switch .vs-thumb::after{ content:""; position:absolute; inset:0; transform:translateX(-130%) skewX(-18deg);
    background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%); }
  .view-switch:hover .vs-thumb::after{ animation:ltShine .9s ease; }
  .view-switch .vs-opt{ position:relative; z-index:1; border:none; background:none; cursor:pointer; font-family:inherit; font-weight:900;
    font-size:13px; letter-spacing:.05em; color:var(--muted); padding:10px 20px; white-space:nowrap; transition:color .3s; }
  .view-switch .vs-opt.active{ color:#1a1300; text-shadow:0 1px 0 rgba(255,255,255,.35); }
  .view-switch .vs-opt:not(.active):hover{ color:var(--txt); }
  @media (prefers-reduced-motion:reduce){
    .view-switch .vs-thumb{ transition:none; }
    .view-switch:hover .vs-thumb::after{ animation:none; }
  }
  @media (max-width:560px){ .view-switch{ display:flex; width:100%; } .view-switch .vs-opt{ flex:1; padding:10px 8px; font-size:12px; } }
</style>
</head>

<header class="site-header">

<div class="container">
  <h1 class="page-title"><span class="shiny" id="palTitle">Palmarès de la Ligue des Champions</span></h1>
  <p class="page-sub" id="palSub"></p>

  <div class="view-switch" id="viewSwitch" role="tablist">
    <span class="vs-thumb" aria-hidden="true"></span>
    <button class="vs-opt active" type="button" data-view="palmares" id="vsPalmares">Palmarès</button>

<script src="i18n.js?v=20"></script>
<script src="espn.js?v=12"></script>
<script src="ui.js?v=1"></script>
<script>
(function(){
  'use strict';
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function el(id){ return document.getElementById(id); }
  var currentView='palmares', palCountStr='';
  if(window.I18N) I18N.mountToggle('#langSwitch');
  if(window.ESPN){ ESPN.mountSeasonMenu('#seasonDD','tracker.html'); ESPN.preserveSeasonLinks(document); }

  function render(){
    var rows=(window.ESPN&&ESPN.palmaresRanking)?ESPN.palmaresRanking():[];
    var yearsLbl=(window.I18N&&I18N.t('pal.colYears'))||'Années';
    // Podium des 3 premiers (égalités regroupées) — cliquable pour révéler les années
    var pod=document.getElementById('podium');
    if(pod){
      var byRank={};
      rows.forEach(function(r){ if(r.rank<=3){ (byRank[r.rank]=byRank[r.rank]||[]).push(r); } });
      var lbl=(window.I18N&&I18N.t('pal.colTitles'))||'titres';
      function block(rk,cls,medal){
        var cl=byRank[rk]; if(!cl||!cl.length) return '';
        var names=cl.map(function(c){return '<div class="pname">'+esc(c.name)+'</div>';}).join('');
        var years=cl.map(function(c){
          var nm=cl.length>1?'<span class="py-club">'+esc(c.name)+'</span>':'';
          return '<div class="py-line">'+nm+c.years.join(' · ')+'</div>';
        }).join('');
        return '<div class="pod '+cls+' has-detail" role="button" tabindex="0" aria-expanded="false">'+
          '<div class="medal">'+medal+'</div>'+names+
          '<div class="ptitles">🏆 <span class="pt-n" data-n="'+cl[0].n+'">'+cl[0].n+'</span> <small>'+esc(lbl)+'</small></div>'+
          '<div class="pod-years"><span class="pdl">'+esc(yearsLbl)+'</span>'+years+'</div>'+
          '<div class="prank">'+rk+'</div></div>';
      }
      pod.innerHTML=block(2,'p2','🥈')+block(1,'p1','👑')+block(3,'p3','🥉');
      animatePodium();
    }
    var body=document.getElementById('palBody'); if(!body) return;
    // Le tableau exclut le podium (top 3) — aucune répétition
    body.innerHTML=rows.filter(function(e){ return e.rank>3; }).map(function(e){
      var medal = e.rank===1?'m1':(e.rank===2?'m2':(e.rank===3?'m3':''));
      var yrs=e.years.join(' · ');
      return '<tr class="pal-row has-detail'+(e.rank<=3?' top':'')+'">'+
        '<td class="pal-rank '+medal+'">'+e.rank+'</td>'+
        '<td class="pal-club"><span class="star">★</span>'+esc(e.name)+'<span class="pal-chev" aria-hidden="true">▼</span></td>'+
        '<td class="pal-titles"><span class="cup">🏆</span> <b>'+e.n+'</b></td>'+
        '<td class="pal-years">'+yrs+'</td>'+
      '</tr>'+
      '<tr class="pal-detail"><td colspan="4"><div class="pal-detail-in"><span class="pdl">'+esc(yearsLbl)+'</span>'+yrs+'</div></td></tr>';
    }).join('');
    palCountStr=rows.length+' '+((window.I18N&&I18N.t('pal.total'))||'clubs');
    refreshTexts();
  }
  function applyFavAccent(){ if(!window.ESPN||!ESPN.favAccent) return; var a=ESPN.favAccent(), root=document.documentElement; if(a) root.style.setProperty('--fav-rgb',a); else root.style.removeProperty('--fav-rgb'); }
  function renderWall(){
    var host=document.getElementById('champWall'); if(!host) return;
    var titleEl=document.getElementById('wallTitle'); if(titleEl) titleEl.textContent=(window.I18N&&I18N.getLang()==='en')?'Hall of champions':'Mur des champions';
    var ranking=(window.ESPN&&ESPN.palmaresRanking)?ESPN.palmaresRanking():[];
    var map={}; ranking.forEach(function(c){ c.years.forEach(function(y){ map[y]={name:c.name, logo:c.logo}; }); });
    var years=Object.keys(map).map(Number).sort(function(a,b){ return b-a; });
    var fav=(window.ESPN&&ESPN.getFav)?ESPN.getFav():null, favName=fav?fav.name.toLowerCase():'';
    host.innerHTML=years.map(function(y){
      var c=map[y], low=c.name.toLowerCase();
      var isFav=favName && (low.indexOf(favName)!==-1 || favName.indexOf(low)!==-1);
      var logo=c.logo?'<img class="cw-logo" src="'+esc(c.logo)+'" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">':'<span class="cw-logo"></span>';
      return '<div class="cw-item'+(isFav?' fav':'')+'">'+logo+'<div class="cw-txt"><span class="yr">'+y+'</span><span class="cl">'+esc(c.name)+'</span></div></div>';
    }).join('');
  }
  function setLabels(){
    var en=window.I18N&&I18N.getLang()==='en';
    var p=el('vsPalmares'), w=el('vsWall');
    if(p) p.textContent=(window.I18N&&I18N.t('nav.palmares'))||'Palmarès';
    if(w) w.textContent=en?'Hall of Champions':'Mur des champions';
  }
  function moveThumb(){
    var sw=el('viewSwitch'); if(!sw) return;
    var a=sw.querySelector('.vs-opt.active'), th=sw.querySelector('.vs-thumb');
    if(!a||!th) return;
    th.style.left=a.offsetLeft+'px'; th.style.width=a.offsetWidth+'px';
  }
  function refreshTexts(){
    var en=window.I18N&&I18N.getLang()==='en';
    if(currentView==='palmares'){
      el('palTitle').textContent=(window.I18N&&I18N.t('pal.pageTitle'))||'Palmarès de la Ligue des Champions';
      el('palSub').textContent=((window.I18N&&I18N.t('pal.pageSub'))||'Classement des clubs par nombre de titres')+' — '+palCountStr;
    } else {
      el('palTitle').textContent=en?'Hall of Champions':'Mur des champions';
      el('palSub').textContent=en?'European Cup / Champions League winners, year by year · 1956–2026':'Vainqueurs de la Coupe d’Europe / Ligue des champions, année par année · 1956–2026';
    }
  }
  function setView(v){
    currentView=v;
    el('viewPalmares').style.display=(v==='palmares')?'':'none';
    el('viewWall').style.display=(v==='wall')?'':'none';
    Array.prototype.forEach.call(el('viewSwitch').querySelectorAll('.vs-opt'),function(b){ b.classList.toggle('active', b.getAttribute('data-view')===v); });
    refreshTexts(); moveThumb();
  }
  applyFavAccent();
  render();
  renderWall();
  setLabels();
  setView('palmares');
  requestAnimationFrame(moveThumb);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(moveThumb);
  window.addEventListener('resize', moveThumb);
  (function bindSwitch(){
    var sw=el('viewSwitch'); if(!sw) return;
    sw.addEventListener('click', function(ev){ var b=ev.target.closest('.vs-opt'); if(b) setView(b.getAttribute('data-view')); });
  })();
  // Mobile : révéler les années de victoire au clic sur la ligne d'un club
  (function bindExpand(){
    var body=document.getElementById('palBody'); if(!body) return;
    body.addEventListener('click', function(ev){
      var row=ev.target.closest('.pal-row.has-detail');
      if(row && body.contains(row)) row.classList.toggle('open');
    });
  })();
  // Podium cliquable : révéler les années de victoire des 3 premiers
  (function bindPodium(){
    var pod=document.getElementById('podium'); if(!pod) return;
    pod.addEventListener('click', function(ev){
      var b=ev.target.closest('.pod.has-detail');
      if(b && pod.contains(b)){ var op=b.classList.toggle('open'); b.setAttribute('aria-expanded', op?'true':'false'); }
    });
  })();

  /* Compteurs animés du podium (0 -> n titres, easing, repli garanti) */
  function animatePodium(){
    var reduce=false; try{ reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches; }catch(e){}
    Array.prototype.forEach.call(document.querySelectorAll('#podium .pt-n'), function(sp){
      var target=parseInt(sp.getAttribute('data-n'),10)||0;
      if(reduce || !window.requestAnimationFrame){ sp.textContent=String(target); return; }
      var t0=null, dur=900;
      sp.textContent='0';
      requestAnimationFrame(function step(ts){
        if(t0==null) t0=ts;
        var p=Math.min(1,(ts-t0)/dur), e=1-Math.pow(1-p,3);
        sp.textContent=String(Math.round(e*target));
        if(p<1) requestAnimationFrame(step);
      });
      setTimeout(function(){ sp.textContent=String(target); }, dur+400);  // filet (onglet caché)
    });
  }

  /* Inclinaison 3D des cartes du podium au survol (souris uniquement) */
  (function podiumTilt(){
    var fine=false, reduce=false;
    try{ fine=window.matchMedia&&matchMedia('(pointer:fine)').matches; }catch(e){}
    try{ reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches; }catch(e){}
    if(!fine || reduce) return;
    var pod=document.getElementById('podium'); if(!pod) return;
    pod.addEventListener('pointermove', function(e){
      var card=e.target.closest('.pod'); if(!card||!pod.contains(card)) return;
      var r=card.getBoundingClientRect();
      var rx=((e.clientY-r.top)/r.height-.5)*-7, ry=((e.clientX-r.left)/r.width-.5)*9;
      card.style.transform='perspective(700px) rotateX('+rx.toFixed(2)+'deg) rotateY('+ry.toFixed(2)+'deg) translateY(-3px)';
    }, {passive:true});
    pod.addEventListener('pointerout', function(e){
      var card=e.target.closest('.pod');
      if(card && !card.contains(e.relatedTarget)) card.style.transform='';
    });
  })();
  if(window.I18N) window.addEventListener('ldc:langchange',function(){ render(); renderWall(); applyFavAccent(); setLabels(); requestAnimationFrame(moveThumb); if(window.ESPN) ESPN.mountSeasonMenu('#seasonDD','tracker.html'); });

  /* Starfield (fond étoilé partagé) */
  (function starfield(){
    var c=document.getElementById('starfield'); if(!c||!c.getContext) return; var ctx=c.getContext('2d'); var stars=[], W=0, H=0;
    function resize(){ var dpr=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; c.width=W*dpr; c.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); build(); }
    function build(){ stars=[]; var n=Math.min(110,Math.floor(W*H/14000)); for(var i=0;i<n;i++) stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+0.3,vy:0.04+Math.random()*0.16,tw:Math.random()*6.28}); }
    function loop(){ if(document.visibilityState==='hidden'){ setTimeout(function(){requestAnimationFrame(loop);},700); return; } ctx.clearRect(0,0,W,H); for(var i=0;i<stars.length;i++){ var s=stars[i]; s.y+=s.vy; s.tw+=0.03; if(s.y>H+2){ s.y=-2; s.x=Math.random()*W; } var a=0.16+0.28*Math.sin(s.tw); if(a<0)a=0; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.28); ctx.fillStyle='rgba(150,170,210,'+a.toFixed(2)+')'; ctx.fill(); } requestAnimationFrame(loop); }
    window.addEventListener('resize',resize); resize(); if(!(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)) requestAnimationFrame(loop);
  })();
})();
</script>
