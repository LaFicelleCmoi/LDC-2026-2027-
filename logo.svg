<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LDC">
  <defs>
    <linearGradient id="ldcBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2855"/>
      <stop offset="1" stop-color="#0a1024"/>
    </linearGradient>
    <linearGradient id="ldcGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#f3ab00"/>
    </linearGradient>
  </defs>
  <!-- écusson rond -->
  <circle cx="50" cy="50" r="46" fill="url(#ldcBg)" stroke="url(#ldcGold)" stroke-width="4.5"/>
  <circle cx="50" cy="50" r="39" fill="none" stroke="#f5b50a" stroke-opacity="0.28" stroke-width="1.2"/>
  <!-- étoile unique (distincte du starball UEFA) -->
  <polygon points="50,16 54.4,28.1 67.2,28.5 56.9,36.4 60.6,48.6 50,41.2 39.4,48.6 43.1,36.4 32.8,28.5 45.6,28.1"
           fill="url(#ldcGold)" stroke="#fff3cf" stroke-width="0.6" stroke-linejoin="round"/>
  <!-- monogramme -->
  <text x="50" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="27" letter-spacing="1.5" fill="#ffffff">LDC</text>
</svg>
