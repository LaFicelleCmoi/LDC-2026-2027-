<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Palmarès — Ligue des Champions</title>
<link rel="icon" href="favicon.svg?v=1" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=14" />
<style>
  /* ---- Podium (flat + prestige) ---- */
  .podium{ display:flex; align-items:flex-end; justify-content:center; gap:14px; margin:8px 0 34px; }
  .pod{ position:relative; flex:1 1 0; max-width:250px; border-radius:12px 12px 4px 4px; padding:18px 13px 16px; text-align:center; border:1px solid; border-top-width:4px; overflow:hidden; }
  .pod .medal{ font-size:1.7em; line-height:1; }
  .pod .pname{ font-weight:800; font-size:1em; margin:6px 0 1px; color:#fff; line-height:1.25; }
  .pod .ptitles{ font-family:'Bebas Neue',Impact,sans-serif; font-size:2.7em; line-height:1; letter-spacing:.03em; margin-top:6px; }
  .pod .ptitles small{ font-family:"Segoe UI",sans-serif; font-size:.3em; font-weight:800; letter-spacing:.14em; text-transform:uppercase; vertical-align:middle; opacity:.75; }
  .pod .prank{ position:absolute; right:11px; bottom:4px; font-family:'Bebas Neue',Impact,sans-serif; font-size:2.6em; line-height:1; opacity:.14; }
  .pod.p1{ min-height:218px; background:rgba(245,181,10,.14); border-color:rgba(245,181,10,.45); border-top-color:#f5b50a; }
  .pod.p1 .ptitles{ color:#ffce4a; }
  .pod.p2{ min-height:174px; background:rgba(206,214,232,.10); border-color:rgba(206,214,232,.35); border-top-color:#cfd6e6; }
  .pod.p2 .ptitles{ color:#e3eaf7; }
  .pod.p3{ min-height:146px; background:rgba(224,160,106,.10); border-color:rgba(224,160,106,.35); border-top-color:#e0a06a; }
  .pod.p3 .ptitles{ color:#eab27e; }
  /* Podium cliquable : années de victoire repliées */
  .pod.has-detail{ cursor:pointer; transition:transform .15s; }
  .pod.has-detail:hover{ transform:translateY(-2px); }
  .pod-years{ display:none; margin-top:10px; padding-top:9px; border-top:1px solid rgba(255,255,255,.16); font-size:11px; line-height:1.65; color:#eef2fb; }
  .pod-years .pdl{ display:block; font-size:9px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--upcoming); margin-bottom:4px; }
  .pod-years .py-club{ display:block; font-weight:800; color:#fff; margin-top:5px; }
  .pod.open{ z-index:2; }
  .pod.open .pod-years{ display:block; }
  .pod.open .prank{ display:none; }
  @media (max-width:560px){ .podium{ gap:7px; } .pod{ padding:13px 7px 12px; } .pod .pname{ font-size:.78em; } .pod .ptitles{ font-size:2em; } .pod .medal{ font-size:1.4em; } }
  .pal-wrap{ max-width:820px; }
  .pal-table{ width:100%; border-collapse:collapse; }
  .pal-table th{ text-align:left; font-size:11px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--muted); padding:10px 12px; border-bottom:1px solid var(--line-2); }
  .pal-table th.c{ text-align:center; } .pal-table th.r{ text-align:right; }
  .pal-table td{ padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
  .pal-table tr:hover td{ background:rgba(255,255,255,.03); }
  .pal-rank{ font-family:var(--font-d,'Segoe UI'); font-weight:900; font-size:18px; text-align:center; width:58px; color:var(--muted); }
  .pal-rank.m1{ color:#ffd24a; } .pal-rank.m2{ color:#cfd6e6; } .pal-rank.m3{ color:#e0a06a; }
  .pal-club{ font-weight:700; font-size:15px; }
  .pal-club .star{ color:var(--upcoming); margin-right:8px; }
  .pal-titles{ text-align:center; width:96px; }
  .pal-titles b{ font-size:18px; font-weight:900; color:var(--upcoming); }
  .pal-titles .cup{ opacity:.85; }
  .pal-years{ text-align:right; color:var(--muted); font-size:12px; line-height:1.5; }
  .pal-row.top td{ background:linear-gradient(90deg, rgba(245,181,10,.10), transparent 60%); }

  /* Détail "années de victoire" — repliable, révélé au clic sur mobile
     (là où la colonne Années est masquée). */
  .pal-chev{ display:none; }
  .pal-detail{ display:none; }
  .pal-detail > td{ padding:0 12px 12px; }
  .pal-detail-in{ background:rgba(245,181,10,.07); border:1px solid rgba(245,181,10,.28); border-radius:10px; padding:9px 12px; color:#cdd6e0; font-size:12.5px; line-height:1.75; }
  .pal-detail-in .pdl{ display:block; font-size:10px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--upcoming); margin-bottom:3px; }

  @media (max-width:640px){
    .pal-years, .pal-table th.r{ display:none; }
    .pal-titles{ width:72px; }
    .pal-row.has-detail{ cursor:pointer; }
    .pal-row.has-detail td{ -webkit-user-select:none; user-select:none; }
    .pal-chev{ display:inline-block; margin-left:7px; color:var(--muted); font-size:10px; vertical-align:middle; transition:transform .2s, color .2s; }
    .pal-row.open .pal-chev{ transform:rotate(180deg); color:var(--upcoming); }
    .pal-row.open td{ border-bottom-color:transparent; }
    .pal-row.open + .pal-detail{ display:table-row; }
  }
</style>
</head>
<body>
<div id="cl-ball"></div>
<canvas id="starfield"></canvas>
<header class="site-header">
  <a class="brand" href="dashboard.html">
    <span class="star">★</span>
    <span><span class="t1" data-i18n="app.title">Tracker Ligue des Champions</span><br><span class="t2" data-i18n="app.subtitle">Suivi live non officiel — données ESPN</span></span>
  </a>
  <nav class="nav">
    <a href="dashboard.html" data-i18n="nav.dashboard">Accueil</a>
    <a href="tracker.html" data-i18n="nav.tracker">Classement</a>
    <a href="palmares.html" class="active" data-i18n="nav.palmares">Palmarès</a>
    <a href="calendrier.html" data-i18n="nav.calendar">Calendrier</a>
    <div id="seasonDD"></div>
    <a href="overlay.html" data-i18n="nav.overlay">Overlay OBS</a>
    <a href="legal.html" data-i18n="nav.legal">Mentions légales</a>
  </nav>
  <div class="header-right">
    <div class="lang-switch" id="langSwitch"></div>
  </div>
</header>

<div class="container">
  <h1 class="page-title"><span class="shiny" data-i18n="pal.pageTitle">Palmarès de la Ligue des Champions</span></h1>
  <p class="page-sub"><span data-i18n="pal.pageSub">Classement des clubs par nombre de titres</span> — <span id="palCount"></span></p>

  <div class="podium pal-wrap" id="podium"></div>

  <div class="card pad pal-wrap">
    <table class="pal-table">
      <thead>
        <tr>
          <th class="c" data-i18n="pal.colRank">Rang</th>
          <th data-i18n="pal.colClub">Club</th>
          <th class="c" data-i18n="pal.colTitles">Titres</th>
          <th class="r" data-i18n="pal.colYears">Années</th>
        </tr>
      </thead>
      <tbody id="palBody"></tbody>
    </table>
  </div>
</div>

<footer class="site-footer">
  <span data-i18n="legal.intro">Projet de fan, non officiel.</span>
  <a href="legal.html" data-i18n="nav.legal">Mentions légales</a>
</footer>

<script src="i18n.js?v=16"></script>
<script src="espn.js?v=10"></script>
<script>
(function(){
  'use strict';
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  if(window.I18N) I18N.mountToggle('#langSwitch');
  if(window.ESPN){ ESPN.mountSeasonMenu('#seasonDD','tracker.html'); ESPN.preserveSeasonLinks(document); }

  function render(){
    var rows=(window.ESPN&&ESPN.palmaresRanking)?ESPN.palmaresRanking():[];
    var yearsLbl=(window.I18N&&I18N.t('pal.colYears'))||'Années';
    // Podium des 3 premiers (égalités regroupées) — cliquable pour révéler les années
    var pod=document.getElementById('podium');
    if(pod){
      var byRank={};
      rows.forEach(function(r){ if(r.rank<=3){ (byRank[r.rank]=byRank[r.rank]||[]).push(r); } });
      var lbl=(window.I18N&&I18N.t('pal.colTitles'))||'titres';
      function block(rk,cls,medal){
        var cl=byRank[rk]; if(!cl||!cl.length) return '';
        var names=cl.map(function(c){return '<div class="pname">'+esc(c.name)+'</div>';}).join('');
        var years=cl.map(function(c){
          var nm=cl.length>1?'<span class="py-club">'+esc(c.name)+'</span>':'';
          return '<div class="py-line">'+nm+c.years.join(' · ')+'</div>';
        }).join('');
        return '<div class="pod '+cls+' has-detail" role="button" tabindex="0" aria-expanded="false">'+
          '<div class="medal">'+medal+'</div>'+names+
          '<div class="ptitles">🏆 '+cl[0].n+' <small>'+esc(lbl)+'</small></div>'+
          '<div class="pod-years"><span class="pdl">'+esc(yearsLbl)+'</span>'+years+'</div>'+
          '<div class="prank">'+rk+'</div></div>';
      }
      pod.innerHTML=block(2,'p2','🥈')+block(1,'p1','👑')+block(3,'p3','🥉');
    }
    var body=document.getElementById('palBody'); if(!body) return;
    // Le tableau exclut le podium (top 3) — aucune répétition
    body.innerHTML=rows.filter(function(e){ return e.rank>3; }).map(function(e){
      var medal = e.rank===1?'m1':(e.rank===2?'m2':(e.rank===3?'m3':''));
      var yrs=e.years.join(' · ');
      return '<tr class="pal-row has-detail'+(e.rank<=3?' top':'')+'">'+
        '<td class="pal-rank '+medal+'">'+e.rank+'</td>'+
        '<td class="pal-club"><span class="star">★</span>'+esc(e.name)+'<span class="pal-chev" aria-hidden="true">▼</span></td>'+
        '<td class="pal-titles"><span class="cup">🏆</span> <b>'+e.n+'</b></td>'+
        '<td class="pal-years">'+yrs+'</td>'+
      '</tr>'+
      '<tr class="pal-detail"><td colspan="4"><div class="pal-detail-in"><span class="pdl">'+esc(yearsLbl)+'</span>'+yrs+'</div></td></tr>';
    }).join('');
    var cnt=document.getElementById('palCount');
    if(cnt) cnt.textContent=rows.length+' '+((window.I18N&&I18N.t('pal.total'))||'clubs');
  }
  render();
  // Mobile : révéler les années de victoire au clic sur la ligne d'un club
  (function bindExpand(){
    var body=document.getElementById('palBody'); if(!body) return;
    body.addEventListener('click', function(ev){
      var row=ev.target.closest('.pal-row.has-detail');
      if(row && body.contains(row)) row.classList.toggle('open');
    });
  })();
  // Podium cliquable : révéler les années de victoire des 3 premiers
  (function bindPodium(){
    var pod=document.getElementById('podium'); if(!pod) return;
    pod.addEventListener('click', function(ev){
      var b=ev.target.closest('.pod.has-detail');
      if(b && pod.contains(b)){ var op=b.classList.toggle('open'); b.setAttribute('aria-expanded', op?'true':'false'); }
    });
  })();
  if(window.I18N) window.addEventListener('ldc:langchange',function(){ render(); if(window.ESPN) ESPN.mountSeasonMenu('#seasonDD','tracker.html'); });

  /* Starfield (fond étoilé partagé) */
  (function starfield(){
    var c=document.getElementById('starfield'); if(!c||!c.getContext) return; var ctx=c.getContext('2d'); var stars=[], W=0, H=0;
    function resize(){ var dpr=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; c.width=W*dpr; c.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); build(); }
    function build(){ stars=[]; var n=Math.min(110,Math.floor(W*H/14000)); for(var i=0;i<n;i++) stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+0.3,vy:0.04+Math.random()*0.16,tw:Math.random()*6.28}); }
    function loop(){ if(document.visibilityState==='hidden'){ setTimeout(function(){requestAnimationFrame(loop);},700); return; } ctx.clearRect(0,0,W,H); for(var i=0;i<stars.length;i++){ var s=stars[i]; s.y+=s.vy; s.tw+=0.03; if(s.y>H+2){ s.y=-2; s.x=Math.random()*W; } var a=0.16+0.28*Math.sin(s.tw); if(a<0)a=0; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.28); ctx.fillStyle='rgba(150,170,210,'+a.toFixed(2)+')'; ctx.fill(); } requestAnimationFrame(loop); }
    window.addEventListener('resize',resize); resize(); requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
