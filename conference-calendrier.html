<!DOCTYPE html>
<html lang="fr" data-comp="uecl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Calendrier — Conference League</title>
<link rel="icon" href="conference.svg?v=1" type="image/svg+xml" />
<link rel="preconnect" href="https://site.api.espn.com" />
<link rel="preconnect" href="https://a.espncdn.com" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="styles.css?v=22" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" />
<link rel="stylesheet" href="clubpanel.css?v=8">
<link rel="stylesheet" href="matchpanel.css?v=3" />
<link rel="stylesheet" href="reactbits.css?v=1" />
<link rel="stylesheet" href="cup.css?v=11" />
</head>
<body>
<canvas id="starfield" data-rb aria-hidden="true"></canvas>
<header class="site-header">
  <a class="brand" href="conference.html">
    <span class="star">★</span>
    <span><span class="t1" data-i18n="uecl.title">Tracker Conference League</span><br><span class="t2" data-i18n="app.subtitle">Suivi live non officiel — données ESPN</span></span>
  </a>
  <nav class="nav">
    <a href="conference.html" data-i18n="nav.dashboard">Accueil</a>
    <a href="conference-classement.html" data-i18n="nav.tracker">Classement</a>
    <a href="conference-calendrier.html" class="active" data-i18n="nav.calendar">Calendrier</a>
    <a href="conference-palmares.html" data-i18n="nav.palmares">Palmarès</a>
    <a href="conference-jeu.html" data-noseason data-i18n="nav.game">Jeu</a>
    <div id="seasonDD"></div>
    <a href="conference-monclub.html" data-i18n="nav.myclub">Mon club</a>
    <a href="europa.html" class="nav-cup to-uel" data-noseason><img src="europa.svg?v=2" alt="" width="16" height="16"><span data-i18n="nav.uel">Europa League</span></a>
    <a href="dashboard.html" class="nav-ucl" data-noseason title="Ligue des Champions" aria-label="Ligue des Champions"><img src="logo.svg?v=4" alt="" width="16" height="16"><span>LDC</span></a>
  </nav>
  <div class="header-right">
    <span id="liveFlag" style="display:none;font-size:11px;font-weight:800;color:var(--live);"><span class="dot live"></span></span>
    <div class="lang-switch" id="langSwitch"></div>
  </div>
</header>

<main class="container">
  <h1 class="page-title"><span class="shiny" data-i18n="cal.title">Calendrier</span><span class="season-chip" id="season-chip"></span></h1>
  <p class="page-sub" id="calSub">Tous les matchs de la saison, par journée</p>

  <div class="souvenir-banner" id="souvenir-banner">
    <span class="sb-label" id="souvenir-banner-label">Souvenir</span>
    <a href="conference-calendrier.html" data-noseason data-i18n="souvenir.back">← Saison actuelle</a>
  </div>

  <div class="cal-view-switch" id="cal-view-switch" role="group" aria-label="Choisir la vue">
    <button class="cal-view-btn" id="cal-view-draw" type="button" aria-pressed="false">◆ Adversaires</button>
    <button class="cal-view-btn" id="cal-view-matches" type="button" aria-pressed="true">📅 Calendrier des rencontres</button>
  </div>

  <div class="cal-filters cal-wrap">
    <select class="cal-select" id="cal-team" aria-label="Filtrer par club"><option value="" data-i18n="cal.allClubs">Tous les clubs</option></select>
    <button class="cal-myteam" id="cal-myteam" type="button" style="display:none">★ <span data-i18n="fav.myTeam">Mon équipe</span></button>
    <button class="cal-myteam" id="cal-ics" type="button" title="Google Agenda, Apple Calendar, Outlook…">📆 <span id="calIcsLbl">Exporter (.ics)</span></button>
  </div>

  <button class="cal-next" id="cal-next" type="button" style="display:none">⤓ <span id="calNextLbl">Prochain match</span></button>

  <div class="cal-wrap" id="cal-body">
    <div class="empty-state" data-i18n="common.loading">Chargement…</div>
  </div>
</main>

<footer class="site-footer">
  <span data-i18n="legal.intro">Projet de fan, non officiel.</span>
  <a href="dashboard.html" data-noseason data-i18n="uel.toUcl">← Ligue des Champions</a>
  <a href="legal.html" data-i18n="nav.legal">Mentions légales</a>
</footer>

<script>window.LDC_LEAGUE = 'uefa.europa.conf';</script>
<script src="i18n.js?v=27"></script>
<script src="standings-engine.js?v=1"></script>
<script src="espn.js?v=28"></script>
<script src="goalalert.js?v=2"></script>
<script src="matchpanel.js?v=4"></script>
<script src="schedule.js?v=2"></script>
<script src="thresholds.js?v=3"></script>
<script src="chances.js?v=1"></script>
<script src="clubpanel.js?v=7"></script>
<script src="reactbits.js?v=1"></script>
<script src="ui.js?v=2"></script>
<script src="cup-calendar.js?v=4"></script>
</body>
</html>
