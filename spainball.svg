<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <!-- Fond de la page Clubs espagnols : ballon lumineux drapé du drapeau
       (rouge, jaune, rouge) et l'étoile de champion du monde (2010). Affiché en mix-blend-mode screen par pagebg.css (pendant du
       franceball.svg de la page Clubs français). -->
  <defs>
    <radialGradient id="glow" cx="44%" cy="38%" r="68%">
      <stop offset="0%"  stop-color="#ffe27a" stop-opacity="0.60"/>
      <stop offset="40%" stop-color="#e2401a" stop-opacity="0.38"/>
      <stop offset="74%" stop-color="#5a0f08" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a1430" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rim" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#ffe39a" stop-opacity="0"/>
      <stop offset="93%" stop-color="#ffe39a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffe39a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="st" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1bf00"/>
    </linearGradient>
    <clipPath id="ball"><circle cx="300" cy="292" r="286"/></clipPath>
    <path id="s" d="M0,-50 L12.3,-17 L47.6,-15.5 L20,6.5 L29.4,40.5 L0,21 L-29.4,40.5 L-20,6.5 L-47.6,-15.5 L-12.3,-17 Z"/>
  </defs>

  <circle cx="300" cy="292" r="288" fill="url(#glow)"/>
  <g clip-path="url(#ball)">
    <path d="M0 0 L600 0 L600 150 Q300 186 0 150 Z" fill="#aa151b" opacity="0.50"/>
    <path d="M0 150 Q300 186 600 150 L600 438 Q300 474 0 438 Z" fill="#f1bf00" opacity="0.42"/>
    <path d="M0 438 Q300 474 600 438 L600 600 L0 600 Z" fill="#aa151b" opacity="0.50"/>
  </g>
  <circle cx="300" cy="292" r="286" fill="url(#rim)"/>

  <!-- méridiens, très discrets -->
  <g fill="none" stroke="#ffe39a" stroke-opacity="0.16" stroke-width="1.4">
    <ellipse cx="300" cy="292" rx="118" ry="286"/>
    <path d="M300 6 Q120 292 300 578"/>
    <path d="M300 6 Q480 292 300 578"/>
  </g>

  <!-- étoile de champion du monde (2010) -->
  <use href="#s" transform="translate(300,300) scale(1.9)" fill="url(#st)" opacity="0.85"/>
</svg>
