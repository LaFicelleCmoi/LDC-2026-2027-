<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ligue des Champions">
  <defs>
    <radialGradient id="ldcBg" cx="50%" cy="34%" r="78%">
      <stop offset="0" stop-color="#26386a"/>
      <stop offset=".62" stop-color="#0c1732"/>
      <stop offset="1" stop-color="#060b1c"/>
    </radialGradient>
    <linearGradient id="ldcGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset=".55" stop-color="#f7bd39"/>
      <stop offset="1" stop-color="#d68d06"/>
    </linearGradient>
    <linearGradient id="ldcStar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4cf"/>
      <stop offset=".5" stop-color="#f9c748"/>
      <stop offset="1" stop-color="#e29b0e"/>
    </linearGradient>
    <linearGradient id="ldcGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- disque + anneau doré biseauté -->
  <circle cx="50" cy="50" r="48" fill="url(#ldcGold)"/>
  <circle cx="50" cy="50" r="47.2" fill="none" stroke="#fff2c4" stroke-opacity=".55" stroke-width=".8"/>
  <circle cx="50" cy="50" r="43.6" fill="url(#ldcBg)"/>
  <circle cx="50" cy="50" r="43.6" fill="none" stroke="#000000" stroke-opacity=".35" stroke-width="1"/>
  <circle cx="50" cy="50" r="39.4" fill="none" stroke="#f5b50a" stroke-opacity=".45" stroke-width="1"/>

  <!-- reflet vitré haut -->
  <ellipse cx="50" cy="29" rx="33" ry="19" fill="url(#ldcGloss)"/>

  <!-- étoile affinée -->
  <polygon points="50,23 53.9,32.1 63.7,33 56.3,39.5 58.5,49.1 50,44 41.5,49.1 43.7,39.5 36.3,33 46.1,32.1"
           fill="url(#ldcStar)" stroke="#fff6d8" stroke-width=".7" stroke-linejoin="round"/>

  <!-- séparateur -->
  <circle cx="33" cy="60.5" r="1.5" fill="#f5b50a"/>
  <rect x="37.5" y="59.7" width="25" height="1.6" rx=".8" fill="#f5b50a" fill-opacity=".5"/>
  <circle cx="67" cy="60.5" r="1.5" fill="#f5b50a"/>

  <!-- monogramme -->
  <text x="50" y="81.5" text-anchor="middle" font-family="Impact, 'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="23" letter-spacing="1.2" fill="#ffffff">LDC</text>
</svg>
