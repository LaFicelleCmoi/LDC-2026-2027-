<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <!-- Fond de la page Clubs anglais : ballon lumineux blanc barré de la
       croix de Saint-Georges, et l'étoile de champion du monde (1966). Affiché en mix-blend-mode screen par pagebg.css (pendant du
       franceball.svg de la page Clubs français). -->
  <defs>
    <radialGradient id="glow" cx="44%" cy="38%" r="68%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.60"/>
      <stop offset="40%" stop-color="#9fb2d8" stop-opacity="0.38"/>
      <stop offset="74%" stop-color="#24345e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a1430" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rim" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#ffd0d6" stop-opacity="0"/>
      <stop offset="93%" stop-color="#ffd0d6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffd0d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="st" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffd0d6"/>
    </linearGradient>
    <clipPath id="ball"><circle cx="300" cy="292" r="286"/></clipPath>
    <path id="s" d="M0,-50 L12.3,-17 L47.6,-15.5 L20,6.5 L29.4,40.5 L0,21 L-29.4,40.5 L-20,6.5 L-47.6,-15.5 L-12.3,-17 Z"/>
  </defs>

  <circle cx="300" cy="292" r="288" fill="url(#glow)"/>
  <g clip-path="url(#ball)">
    <rect x="0" y="0" width="600" height="600" fill="#ffffff" opacity="0.10"/>
    <path d="M250 0 Q232 292 250 600 L350 600 Q368 292 350 0 Z" fill="#ce1124" opacity="0.55"/>
    <path d="M0 246 Q300 226 600 246 L600 340 Q300 360 0 340 Z" fill="#ce1124" opacity="0.55"/>
  </g>
  <circle cx="300" cy="292" r="286" fill="url(#rim)"/>

  <!-- méridiens, très discrets -->
  <g fill="none" stroke="#ffd0d6" stroke-opacity="0.16" stroke-width="1.4">
    <ellipse cx="300" cy="292" rx="118" ry="286"/>
    <path d="M300 6 Q120 292 300 578"/>
    <path d="M300 6 Q480 292 300 578"/>
  </g>

  <!-- étoile de champion du monde (1966) -->
  <use href="#s" transform="translate(300,108) scale(0.85)" fill="url(#st)" opacity="0.92"/>
</svg>
