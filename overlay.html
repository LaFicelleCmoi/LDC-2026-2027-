<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Overlay OBS — Ligue des Champions</title>
<link rel="icon" href="favicon.svg?v=1" type="image/svg+xml" />
<!--
  overlay.html — OVERLAY OBS AUTONOME (aucune dépendance externe à part l'API ESPN)
  Fond TRANSPARENT obligatoire pour la source navigateur OBS.
  Paramètres d'URL :
    ?team=PSG            épingle un club (nom anglais OU abréviation 3 lettres)
    ?pos=top-left|top-right|bottom-left|bottom-right   (défaut bottom-left)
    ?scale=1.3           échelle du scorebug
    ?hideEmpty=1         masque tout s'il n'y a aucun match à afficher
    ?lang=fr|en          langue
-->
<style>
  :root{
    --bg:        rgba(11,14,26,0.92);
    --bg2:       rgba(20,24,42,0.92);
    --line:      rgba(255,255,255,0.10);
    --txt:       #f4f6ff;
    --muted:     #9aa3c4;
    --live:      #ff3b46;
    --upcoming:  #f5b50a;
    --finished:  #28c76f;
    --interrupt: #ff8a00;
    --pen:       #4aa8ff;
    --accent:    #1b68ff;
  }

  html,body{
    margin:0; padding:0;
    background:transparent !important;   /* indispensable pour OBS */
    font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
    color:var(--txt);
    -webkit-font-smoothing:antialiased;
  }

  /* ---- Ancrage dans un coin ------------------------------------------- */
  #stage{ position:fixed; inset:0; pointer-events:none; }
  #wrap{
    position:fixed; max-width:430px; pointer-events:none;
    transform-origin:top left;
  }
  #wrap.pos-top-left{     top:16px;    left:16px;   transform-origin:top left; }
  #wrap.pos-top-right{    top:16px;    right:16px;  transform-origin:top right; }
  #wrap.pos-bottom-left{  bottom:16px; left:16px;   transform-origin:bottom left; }
  #wrap.pos-bottom-right{ bottom:16px; right:16px;  transform-origin:bottom right; }

  /* ---- Scorebug -------------------------------------------------------- */
  .scorebug{
    background:linear-gradient(160deg,var(--bg),var(--bg2));
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:0 18px 50px rgba(0,0,0,.55);
    overflow:hidden;
    backdrop-filter:blur(4px);
    width:410px;
    transition:transform .18s ease;
  }
  .scorebug.bump{ animation:bump .6s ease; }
  @keyframes bump{ 0%{transform:scale(1)} 30%{transform:scale(1.05)} 100%{transform:scale(1)} }
  .scorebug.goal-flash::after{
    content:""; position:absolute; inset:0; border-radius:14px;
    background:radial-gradient(circle at 50% 0%,rgba(40,199,111,.55),transparent 70%);
    animation:flash 1.2s ease forwards; pointer-events:none;
  }
  @keyframes flash{ 0%{opacity:1} 100%{opacity:0} }
  .scorebug{ position:relative; }

  .topbar{ height:6px; width:100%; background:var(--upcoming); transition:background .3s; }
  .topbar.live{ background:var(--live); animation:pulseBar 1.4s infinite; }
  .topbar.finished{ background:var(--finished); }
  .topbar.upcoming{ background:var(--upcoming); }
  .topbar.interrupt{ background:var(--interrupt); }
  @keyframes pulseBar{ 0%,100%{opacity:1} 50%{opacity:.45} }

  .bug-main{
    display:flex; align-items:center; gap:10px;
    padding:11px 13px 9px;
  }
  .state{
    font-size:10px; font-weight:800; letter-spacing:.6px;
    padding:3px 7px; border-radius:6px; white-space:nowrap;
    text-transform:uppercase;
  }
  .state.live{ background:var(--live); color:#fff; }
  .state.live::before{ content:"● "; }
  .state.upcoming{ background:var(--upcoming); color:#1a1300; }
  .state.finished{ background:var(--finished); color:#04270f; }
  .state.interrupt{ background:var(--interrupt); color:#241200; }

  .clock{
    font-variant-numeric:tabular-nums; font-weight:800; font-size:16px;
    min-width:46px; text-align:center;
  }
  .clock .extra{
    color:var(--finished); background:rgba(40,199,111,.18);
    border-radius:5px; padding:0 4px; margin-left:1px; font-size:13px;
  }

  .teams{ display:flex; align-items:flex-start; flex:1; gap:6px; justify-content:space-between; }
  .team{ display:flex; flex-direction:column; align-items:center; gap:3px; width:84px; }
  .team .crest{ width:34px; height:34px; object-fit:contain; filter:drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
  .team .abbr{ font-weight:800; font-size:13px; letter-spacing:.4px; }
  .team .cards{ font-size:10px; letter-spacing:1px; min-height:12px; }

  .score-box{ display:flex; align-items:center; gap:7px; }
  .score{ font-size:28px; font-weight:900; font-variant-numeric:tabular-nums; line-height:1; }
  .score.win{ color:#fff; }
  .score.lose{ color:var(--muted); }
  .comp-logo{ width:26px; height:26px; object-fit:contain; opacity:.9; }
  .pens{ font-size:11px; color:var(--pen); font-weight:700; text-align:center; margin-top:-4px; }

  /* ---- Bannière spéciale (interrompu / pause fraîcheur) --------------- */
  .banner{
    display:none; align-items:center; gap:7px;
    padding:6px 13px; font-weight:800; font-size:12.5px;
    border-top:1px solid var(--line);
  }
  .banner.show{ display:flex; }
  .banner.interrupt{ color:var(--interrupt); background:rgba(255,138,0,.12); }
  .banner.drinks{ color:#7fdfff; background:rgba(74,168,255,.12); }

  /* ---- Liste des événements ------------------------------------------- */
  .events{ border-top:1px solid var(--line); max-height:260px; overflow:hidden; }
  .events:empty{ display:none; }
  .evt{
    display:flex; align-items:center; gap:7px;
    padding:5px 13px; font-size:12.5px; border-bottom:1px solid rgba(255,255,255,.04);
    animation:evtIn .35s ease;
  }
  @keyframes evtIn{ from{opacity:0; transform:translateX(-6px)} to{opacity:1; transform:none} }
  .evt:last-child{ border-bottom:none; }
  .evt .emo{ width:18px; text-align:center; }
  .evt .min{ font-variant-numeric:tabular-nums; color:var(--muted); min-width:32px; font-weight:700; }
  .evt .min.card{ color:var(--live); }
  .evt .eabbr{ font-weight:800; min-width:34px; }
  .evt .who{ flex:1; color:var(--txt); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .evt .tag{
    font-size:9.5px; font-weight:800; letter-spacing:.4px;
    padding:2px 5px; border-radius:5px; background:rgba(255,255,255,.10); color:var(--muted);
  }
  .evt .tag.pen{ background:rgba(74,168,255,.22); color:#9fd0ff; }
  .evt .tag.cf{ background:rgba(245,181,10,.20); color:#ffd97a; }
  .evt .tag.csc{ background:rgba(255,59,70,.20); color:#ff9aa0; }
  .evt .tag.miss{ background:rgba(255,59,70,.20); color:#ff9aa0; }

  .meta{
    display:flex; justify-content:space-between; align-items:center;
    padding:6px 13px; font-size:10.5px; color:var(--muted);
    border-top:1px solid var(--line);
  }
  .meta .cd{ color:var(--upcoming); font-weight:800; font-variant-numeric:tabular-nums; }
  .dots{ display:flex; gap:4px; }
  .dots i{ width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.25); }
  .dots i.on{ background:var(--txt); }

  /* ---- État vide ------------------------------------------------------- */
  .empty{
    padding:14px 16px; font-size:13px; color:var(--muted);
    display:flex; align-items:center; gap:8px;
  }

  /* ---- Toggle langue : discret, visible au survol seulement ----------- */
  #langToggle{
    position:fixed; top:6px; right:8px; display:flex; gap:4px;
    opacity:0; transition:opacity .25s; pointer-events:auto; z-index:10;
  }
  #stage:hover #langToggle{ opacity:.85; }
  #langToggle button{
    background:rgba(11,14,26,.9); color:#cdd4f0; border:1px solid var(--line);
    border-radius:6px; font-size:10px; font-weight:800; padding:3px 7px; cursor:pointer;
  }
  #langToggle button.active{ background:var(--accent); color:#fff; }
</style>
</head>
<body>
<div id="stage">
  <div id="langToggle">
    <button data-lang="fr">FR</button>
    <button data-lang="en">EN</button>
  </div>
  <div id="wrap" class="pos-bottom-left"><div id="root"></div></div>
</div>

<script>
/* =======================================================================
   OVERLAY — tout est inline pour être 100% autonome et robuste.
   ======================================================================= */
(function(){
  'use strict';

  /* ===== LA constante de compétition ===== */
  var LEAGUE_SLUG = 'uefa.champions';
  var BASE = 'https://site.api.espn.com/apis/site/v2/sports/soccer/' + LEAGUE_SLUG;
  var FALLBACK_COMP_LOGO = 'https://a.espncdn.com/i/leaguelogos/soccer/500/2.png';

  /* ---- mini i18n (clé localStorage partagée ldc_lang) ---- */
  var STR = {
    live:      {fr:'EN DIRECT', en:'LIVE'},
    upcoming:  {fr:'À VENIR',   en:'UPCOMING'},
    finished:  {fr:'TERMINÉ',   en:'FINISHED'},
    interrupt: {fr:'⏸ Interrompu', en:'⏸ Interrupted'},
    drinks:    {fr:'💧 Pause fraîcheur', en:'💧 Cooling break'},
    none:      {fr:'Aucun match en direct', en:'No live match'},
    waiting:   {fr:'⚽ En attente de matchs…', en:'⚽ Waiting for matches…'},
    pens:      {fr:'tab', en:'pens'},
    updated:   {fr:'maj', en:'upd'},
    kickoff:   {fr:'coup d’envoi dans', en:'kick-off in'}
  };
  function lang(){
    try{ var l=localStorage.getItem('ldc_lang'); if(l==='fr'||l==='en') return l; }catch(e){}
    return 'fr';
  }
  function t(k){ var e=STR[k]; return e? (e[lang()]||e.fr) : k; }

  /* ---- params URL ---- */
  var P = new URLSearchParams(location.search);
  var PINNED = (P.get('team')||'').trim();
  var POS = (P.get('pos')||'bottom-left').toLowerCase();
  if(['top-left','top-right','bottom-left','bottom-right'].indexOf(POS)===-1) POS='bottom-left';
  var SCALE = parseFloat(P.get('scale')); if(isNaN(SCALE)||SCALE<=0) SCALE=1;
  var HIDE_EMPTY = P.get('hideEmpty')==='1';
  var urlLang = (P.get('lang')||'').toLowerCase();
  if(urlLang==='fr'||urlLang==='en'){ try{ localStorage.setItem('ldc_lang',urlLang); }catch(e){} }

  var wrap = document.getElementById('wrap');
  wrap.className = 'pos-'+POS;
  wrap.style.transform = 'scale('+SCALE+')';

  /* ---- fetch robuste avec timeout ---- */
  function fetchJSON(url, timeout){
    timeout = timeout||10000;
    if(window.AbortSignal && AbortSignal.timeout){
      return fetch(url,{signal:AbortSignal.timeout(timeout),cache:'no-store'}).then(ok);
    }
    var ctrl = (typeof AbortController!=='undefined')? new AbortController():null;
    var o={cache:'no-store'}; if(ctrl) o.signal=ctrl.signal;
    var tm=setTimeout(function(){ if(ctrl) ctrl.abort(); },timeout);
    return fetch(url,o).then(function(r){clearTimeout(tm);return ok(r);},function(e){clearTimeout(tm);throw e;});
  }
  function ok(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }

  /* ---- parsing défensif ---- */
  function num(v){ var n=parseInt(v,10); return isNaN(n)?0:n; }
  function normalize(ev){
    try{
      if(!ev||!ev.competitions||!ev.competitions.length) return null;
      var comp=ev.competitions[0];
      if(!comp||!comp.status||!comp.status.type) return null;
      var cs=comp.competitors||[]; if(cs.length<2) return null;
      var h=cs.filter(function(c){return c.homeAway==='home';})[0]||cs[0];
      var a=cs.filter(function(c){return c.homeAway==='away';})[0]||cs[1];
      if(!h||!a) return null;
      return {
        id:ev.id, date:ev.date,
        dateObj: ev.date? new Date(ev.date):null,
        state:comp.status.type.state||'pre',
        statusName:comp.status.type.name||'',
        displayClock:comp.status.displayClock||'',
        home:team(h), away:team(a)
      };
    }catch(e){ return null; }
  }
  function team(c){
    var tm=c.team||{};
    return {
      id:tm.id||'', score:num(c.score),
      shootout:(c.shootoutScore!=null&&c.shootoutScore!=='')?num(c.shootoutScore):null,
      winner:!!c.winner,
      name:tm.displayName||tm.shortDisplayName||'—',
      abbr:(tm.abbreviation||'').toUpperCase()||'—',
      logo:tm.logo||''
    };
  }
  function matchesPinned(m){
    if(!PINNED) return false;
    var q=PINNED.toLowerCase();
    function hit(c){ return c.abbr.toLowerCase()===q || c.name.toLowerCase().indexOf(q)!==-1; }
    return hit(m.home)||hit(m.away);
  }
  function isInterrupted(m){ return /STATUS_(DELAYED|SUSPENDED|ABANDONED|POSTPONED|CANCEL)/.test(m.statusName); }

  /* ---- horloge "90'+3'" ---- */
  function clockHTML(m){
    var dc=m.displayClock||'';
    if(m.state==='post') return "FT";
    if(!dc) return m.state==='pre'?'–':"0'";
    var i=dc.indexOf('+');
    if(i===-1) return esc(dc);
    return esc(dc.slice(0,i))+'<span class="extra">'+esc(dc.slice(i))+'</span>';
  }
  function clockMinute(dc){
    if(!dc) return 0;
    var mt=dc.match(/(\d+)/g); if(!mt) return 0;
    var base=parseInt(mt[0],10)||0;
    var extra=mt[1]?(parseInt(mt[1],10)||0):0;
    return base + extra/100;
  }

  /* ---- mapping type d'événement -> emoji + tag ---- */
  function mapEvent(e){
    var x=(e.typeText||'').toLowerCase();
    var o={emoji:'•', tag:'', tagClass:'', card:false, hidden:false};
    if(x.indexOf('yellow card')!==-1){ o.emoji='🟨'; o.card=true; }
    else if(x.indexOf('red card')!==-1){ o.emoji='🟥'; o.card=true; }
    else if(x.indexOf('own goal')!==-1){ o.emoji='⚽'; o.tag='CSC'; o.tagClass='csc'; }
    else if(x.indexOf('penalty')!==-1 && /(miss|saved|fail)/.test(x)){ o.emoji='❌'; o.tag='PEN✗'; o.tagClass='miss'; }
    else if(x.indexOf('penalty')!==-1){ o.emoji='⚽'; o.tag='PEN'; o.tagClass='pen'; }
    else if(x.indexOf('free')!==-1 && x.indexOf('goal')!==-1){ o.emoji='⚽'; o.tag='CF'; o.tagClass='cf'; }
    else if(x.indexOf('goal')!==-1){ o.emoji='⚽'; }
    else if(x.indexOf('substitution')!==-1){ o.emoji='🔁'; }
    else if(x.indexOf('start delay')!==-1){ o.emoji= /drink/.test(x)?'💧':'⏸'; }
    else if(x.indexOf('end delay')!==-1){ o.emoji='▶️'; }
    else if(x.indexOf('var')!==-1){ o.emoji='📺'; }
    else { o.hidden=true; } // type inconnu -> on n'encombre pas
    return o;
  }

  /* drinks break : Start Delay (drinks) non suivi d'un End Delay */
  function drinksBreak(keyEvents){
    var inDelay=false, drinks=false;
    keyEvents.forEach(function(e){
      var x=(e.typeText||'').toLowerCase();
      if(x.indexOf('start delay')!==-1){ inDelay=true; drinks=/drink/.test(x); }
      else if(x.indexOf('end delay')!==-1){ inDelay=false; drinks=false; }
    });
    return inDelay && drinks;
  }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  /* =====================================================================
     ÉTAT
     ===================================================================== */
  var compLogo = FALLBACK_COMP_LOGO;
  var matches = [];          // matchs du jour (normalisés)
  var rotation = [];         // matchs candidats à l'affichage
  var rotIndex = 0;
  var current = null;        // match affiché
  var summaries = {};        // id -> { ts, keyEvents }
  var prevTotals = {};       // id -> score total (détection but)
  var hasRenderedOnce = false;

  /* ---- sélection des matchs à afficher ---- */
  function refreshRotation(){
    if(PINNED){
      var pin = matches.filter(matchesPinned);
      rotation = pin.length? [pin[0]] : [];
      return;
    }
    // sinon : tous les matchs en direct
    rotation = matches.filter(function(m){ return m.state==='in'; });
    if(rotIndex>=rotation.length) rotIndex=0;
  }

  /* =====================================================================
     RÉCUP DONNÉES
     ===================================================================== */
  function pollScoreboard(){
    if(document.visibilityState==='hidden') return;
    fetchJSON(BASE+'/scoreboard').then(function(data){
      try{
        if(data && data.leagues && data.leagues[0] && data.leagues[0].logos && data.leagues[0].logos[0]){
          compLogo = data.leagues[0].logos[0].href || compLogo;
        }
      }catch(e){}
      var evs = (data&&data.events)?data.events:[];
      var norm = [];
      evs.forEach(function(ev){ var m=normalize(ev); if(m) norm.push(m); });
      matches = norm;
      refreshRotation();
      if(!current || rotation.indexOf(current)===-1) current = rotation[0]||null;
      render();
      if(current) pollSummary(current.id, true);
    }).catch(function(){
      // échec/timeout : on GARDE le dernier affichage. On affiche juste l'attente si rien encore.
      if(!hasRenderedOnce) render();
    });
  }

  function pollSummary(eventId, force){
    if(!eventId) return;
    var hit=summaries[eventId];
    if(hit && !force && (Date.now()-hit.ts)<20000) return;
    fetchJSON(BASE+'/summary?event='+encodeURIComponent(eventId)).then(function(data){
      var raw=(data&&(data.keyEvents||data.plays))||[];
      var list=[];
      raw.forEach(function(e){
        try{
          var p=(e.participants&&e.participants[0]&&e.participants[0].athlete)||null;
          list.push({
            typeText:(e.type&&e.type.text)||'',
            clock:(e.clock&&e.clock.displayValue)||'',
            teamId:(e.team&&e.team.id)||'',
            player:p?p.displayName:''
          });
        }catch(err){}
      });
      summaries[eventId]={ts:Date.now(), keyEvents:list};
      if(current && current.id===eventId) render();
    }).catch(function(){ /* garder l'existant */ });
  }

  /* =====================================================================
     RENDU
     ===================================================================== */
  function render(){
    hasRenderedOnce=true;
    var root=document.getElementById('root');

    if(!current){
      if(HIDE_EMPTY){ root.innerHTML=''; return; }
      root.innerHTML='<div class="scorebug"><div class="topbar upcoming"></div>'+
        '<div class="empty">'+esc(matches.length? t('none') : t('waiting'))+'</div></div>';
      return;
    }

    var m=current;
    var stateKey = isInterrupted(m)?'interrupt':(m.state==='in'?'live':(m.state==='post'?'finished':'upcoming'));
    var stateLabel = stateKey==='interrupt'? t('live') : t(stateKey==='live'?'live':stateKey==='finished'?'finished':'upcoming');

    var ke=(summaries[m.id]&&summaries[m.id].keyEvents)||[];

    // détection but (flash)
    var total=m.home.score+m.away.score;
    var goal = (prevTotals[m.id]!=null && total>prevTotals[m.id]);
    prevTotals[m.id]=total;

    // cartons par équipe
    var cards=cardCounts(ke);
    var homeCards=cardStr(cards[m.home.id]);
    var awayCards=cardStr(cards[m.away.id]);

    // vainqueur (style score)
    var hWin = m.state==='post' && (m.home.winner || (m.home.shootout!=null&&m.away.shootout!=null&&m.home.shootout>m.away.shootout) || (m.home.shootout==null&&m.home.score>m.away.score));
    var aWin = m.state==='post' && (m.away.winner || (m.home.shootout!=null&&m.away.shootout!=null&&m.away.shootout>m.home.shootout) || (m.home.shootout==null&&m.away.score>m.home.score));

    var pensLine='';
    if(m.home.shootout!=null && m.away.shootout!=null){
      pensLine='<div class="pens">'+t('pens')+' '+m.home.shootout+'–'+m.away.shootout+'</div>';
    }

    // bannières spéciales
    var bannerHTML='';
    if(isInterrupted(m)){
      bannerHTML='<div class="banner interrupt show">'+esc(t('interrupt'))+'</div>';
    } else if(m.state==='in' && drinksBreak(ke)){
      bannerHTML='<div class="banner drinks show">'+esc(t('drinks'))+'</div>';
    }

    // liste d'événements (plus récent -> plus ancien)
    var eventsHTML=renderEvents(m, ke);

    // meta : compte à rebours (à venir) / maj / points de rotation
    var metaLeft='';
    if(m.state==='pre' && m.dateObj){
      metaLeft='<span class="cd" data-kickoff="'+m.dateObj.getTime()+'">'+countdown(m.dateObj)+'</span>';
    } else {
      metaLeft='<span>'+esc(t('updated'))+' '+nowHM()+'</span>';
    }
    var dots='';
    if(rotation.length>1){
      dots='<span class="dots">'+rotation.map(function(_,i){return '<i class="'+(i===rotIndex?'on':'')+'"></i>';}).join('')+'</span>';
    }

    root.innerHTML =
      '<div class="scorebug" id="bug">'+
        '<div class="topbar '+stateKey+'"></div>'+
        '<div class="bug-main">'+
          '<div class="clock">'+clockHTML(m)+'</div>'+
          '<div class="teams">'+
            teamCol(m.home, hWin, homeCards)+
            '<div style="display:flex;flex-direction:column;align-items:center;">'+
              '<div class="state '+stateKey+'">'+esc(stateLabel)+'</div>'+
              '<div class="score-box">'+
                '<span class="score '+(hWin?'win':(aWin?'lose':''))+'">'+m.home.score+'</span>'+
                '<img class="comp-logo" src="'+esc(compLogo)+'" alt="" onerror="this.style.display=\'none\'">'+
                '<span class="score '+(aWin?'win':(hWin?'lose':''))+'">'+m.away.score+'</span>'+
              '</div>'+
              pensLine+
            '</div>'+
            teamCol(m.away, aWin, awayCards)+
          '</div>'+
        '</div>'+
        bannerHTML+
        eventsHTML+
        '<div class="meta">'+metaLeft+dots+'</div>'+
      '</div>';

    if(goal){
      var bug=document.getElementById('bug');
      if(bug){ bug.classList.add('goal-flash','bump'); setTimeout(function(){ try{bug.classList.remove('goal-flash','bump');}catch(e){} },1200); }
    }
  }

  function teamCol(c, win, cardsStr){
    return '<div class="team">'+
      '<img class="crest" src="'+esc(c.logo)+'" alt="" onerror="this.style.visibility=\'hidden\'">'+
      '<span class="abbr">'+esc(c.abbr)+'</span>'+
      '<span class="cards">'+cardsStr+'</span>'+
    '</div>';
  }

  function cardCounts(ke){
    var map={};
    ke.forEach(function(e){
      var x=(e.typeText||'').toLowerCase();
      if(!e.teamId) return;
      if(!map[e.teamId]) map[e.teamId]={y:0,r:0};
      if(x.indexOf('yellow card')!==-1) map[e.teamId].y++;
      else if(x.indexOf('red card')!==-1) map[e.teamId].r++;
    });
    return map;
  }
  function cardStr(c){
    if(!c) return '';
    var out=[];
    if(c.y) out.push('🟨'+c.y);
    if(c.r) out.push('🟥'+c.r);
    return out.join(' ');
  }

  function renderEvents(m, ke){
    if(!ke || !ke.length) return '';
    var rows = ke.map(function(e,i){ return {e:e, i:i, min:clockMinute(e.clock), map:mapEvent(e)}; })
                 .filter(function(r){ return !r.map.hidden; });
    // tri décroissant (plus récent d'abord)
    rows.sort(function(a,b){ if(b.min!==a.min) return b.min-a.min; return b.i-a.i; });
    rows = rows.slice(0,12); // on borne pour ne pas déborder l'écran
    if(!rows.length) return '';

    var abbrOf = function(teamId){
      if(teamId===m.home.id) return m.home.abbr;
      if(teamId===m.away.id) return m.away.abbr;
      return '';
    };

    var html = rows.map(function(r){
      var e=r.e, mp=r.map;
      var tag = mp.tag? '<span class="tag '+mp.tagClass+'">'+esc(mp.tag)+'</span>' : '';
      return '<div class="evt">'+
        '<span class="emo">'+mp.emoji+'</span>'+
        '<span class="min'+(mp.card?' card':'')+'">'+esc(e.clock||'')+'</span>'+
        '<span class="eabbr">'+esc(abbrOf(e.teamId))+'</span>'+
        '<span class="who">'+esc(e.player||e.typeText||'')+'</span>'+
        tag+
      '</div>';
    }).join('');
    return '<div class="events">'+html+'</div>';
  }

  /* ---- compte à rebours ---- */
  function countdown(d){
    var ms=d.getTime()-Date.now();
    if(ms<=0) return "0'";
    var s=Math.floor(ms/1000), h=Math.floor(s/3600), mm=Math.floor((s%3600)/60), ss=s%60;
    function p(n){return n<10?'0'+n:''+n;}
    return (h>0? h+':' : '') + p(mm)+':'+p(ss);
  }
  function nowHM(){ var d=new Date(); function p(n){return n<10?'0'+n:''+n;} return p(d.getHours())+':'+p(d.getMinutes()); }

  /* ---- ticking pour countdown sans tout re-render ---- */
  function tickCountdown(){
    try{
      var el=document.querySelector('.cd[data-kickoff]');
      if(el){
        var ts=parseInt(el.getAttribute('data-kickoff'),10);
        if(!isNaN(ts)) el.textContent=countdown(new Date(ts));
      }
    }catch(e){}
  }

  /* ---- rotation entre matchs en direct ---- */
  function rotate(){
    try{
      if(rotation.length<=1) return;
      rotIndex=(rotIndex+1)%rotation.length;
      current=rotation[rotIndex];
      render();
      if(current) pollSummary(current.id,false);
    }catch(e){}
  }

  /* ---- toggle langue ---- */
  Array.prototype.forEach.call(document.querySelectorAll('#langToggle button'),function(b){
    b.addEventListener('click',function(){
      try{ localStorage.setItem('ldc_lang', b.getAttribute('data-lang')); }catch(e){}
      markLang(); render();
    });
  });
  function markLang(){
    Array.prototype.forEach.call(document.querySelectorAll('#langToggle button'),function(b){
      b.classList.toggle('active', b.getAttribute('data-lang')===lang());
    });
    document.documentElement.setAttribute('lang', lang());
  }

  /* =====================================================================
     BOUCLES (avec try/catch)
     ===================================================================== */
  markLang();
  render(); // affichage initial (attente)
  pollScoreboard();

  setInterval(function(){ try{ pollScoreboard(); }catch(e){} }, 18000);   // scoreboard
  setInterval(function(){ try{ if(current) pollSummary(current.id,false);}catch(e){} }, 12000); // summary du match courant
  setInterval(function(){ try{ rotate(); }catch(e){} }, 10000);           // rotation ~10s
  setInterval(function(){ try{ tickCountdown(); }catch(e){} }, 1000);     // countdown

  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible'){ try{ pollScoreboard(); }catch(e){} }
  });

})();
</script>
</body>
</html>
